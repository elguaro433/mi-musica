/* Línea de tiempo del sonido: cada aviso del iPhone con su hora exacta. Va dentro del informe,
   para ver en qué ORDEN pasan las cosas al salir de la app (no se puede adivinar desde el PC). */
var LINEA = [];
function linea(t){
  var d = new Date(), h = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)+'.'+('00'+d.getMilliseconds()).slice(-3);
  LINEA.push(h + ' ' + t); if(LINEA.length > 70) LINEA.shift();
  try{ localStorage.setItem('mm_linea', JSON.stringify(LINEA)); }catch(_){}
}
try{ LINEA = JSON.parse(localStorage.getItem('mm_linea') || '[]') || []; }catch(_){ LINEA = []; }

['play','playing','pause','ended','error','stalled','suspend','waiting','emptied','abort'].forEach(function(n){
  audio.addEventListener(n, function(){ linea('audio:' + n + (n === 'error' && audio.error ? '(' + audio.error.code + ')' : '') + ' t=' + Math.round(audio.currentTime) + (audio.paused ? ' [pausado]' : '')); });
});
['blur','focus','pagehide','pageshow'].forEach(function(n){
  window.addEventListener(n, function(){ linea('ventana:' + n); });
});
['freeze','resume'].forEach(function(n){
  document.addEventListener(n, function(){ linea('documento:' + n); });
});
document.addEventListener('visibilitychange', function(){ linea('visibilidad:' + document.visibilityState); });
try{
  if(navigator.audioSession){
    navigator.audioSession.type = 'playback';          // música: debe seguir en segundo plano
    navigator.audioSession.addEventListener('statechange', function(){ linea('iOS audioSession:' + navigator.audioSession.state); });
    linea('audioSession.type=' + navigator.audioSession.type);
  }else linea('este iPhone no tiene audioSession');
}catch(e){ linea('audioSession error ' + e.message); }

var interrumpida = 0, tSalida = 0, intentosSalida = 0;
/* Reintento «consciente de la suspensión» (técnica de los reproductores PWA para iOS): iOS congela la
   página mientras otra app tiene el sonido, y al despertarla los temporizadores atrasados se disparan
   de golpe. Si el aviso llega MÁS de 5 s tarde, la página estuvo dormida: no se arranca solo (sería sonar
   de repente, o pelearse con la otra app); se deja el ▶ a mano y un toque lo reanuda. */
function reintentarSiDespierto(fn, ms){
  var t0 = Date.now();
  setTimeout(function(){
    if(Date.now() - t0 > ms + 5000){
      linea('reintento llegó ' + Math.round((Date.now() - t0 - ms) / 1000) + ' s tarde: la página estuvo dormida; dejo ▶');
      quedarEnPausaVisible(); return;
    }
    fn();
  }, ms);
}
/* Que se vea y funcione el ▶ (app, pantalla de bloqueo y coche) cuando la música quedó en pausa por otra app. */
function quedarEnPausaVisible(){
  if(!actual) return;
  if(!interrumpida) interrumpida = Date.now();
  pintarBotones(false);                         // también pone mediaSession.playbackState = 'paused'
  pintarEstado('Toca ▶ para seguir');
  try{ volverAPonerFicha(); navigator.mediaSession.playbackState = 'paused'; }catch(_){}
}
/* Al SALIR de la app (inicio, WhatsApp, galería, cámara…) algunos iPhone mandan un «pause»
   suelto aunque nadie más suene. Eso NO es una interrupción: la música tiene que seguir.
   Una interrupción de verdad (audio de WhatsApp, llamada, grabar vídeo) llega varios
   segundos DESPUÉS de haber salido: esa sí se respeta y espera. El «pause» puede llegar un
   pelín antes o un pelín después del aviso de «salí de la app»; se cubren los dos órdenes. */
function seguirTrasSalir(){
  if(!actual || !audio.paused || pausaMia || paradoPorMi || viendoVideo || audio.ended) return;
  anotar('sonido', 'pausa al salir de la app (no es otra app): sigo', actual.titulo);
  interrumpida = 0; intentosSalida = 0;
  (function intentar(){
    if(!actual || !audio.paused || pausaMia || paradoPorMi || viendoVideo) return;
    if(actual.tipo === 'radio' && intentosSalida === 0){ try{ audio.src = actual.url; }catch(_){} }
    var p = audio.play();
    if(p && p.catch) p.catch(function(er){
      linea('play() rechazado: ' + (er && er.name) + ' · ' + String((er && er.message) || '').slice(0, 60));
      intentosSalida++;
      if(intentosSalida < 4) reintentarSiDespierto(intentar, 700 * intentosSalida);
      else{ interrumpida = Date.now(); pintarEstado('Toca ▶ para seguir'); anotar('sonido', 'no me dejó seguir al salir'); }
    });
  })();
}
function marcarSalida(){
  tSalida = Date.now();
  // el «pause» llegó justo antes de este aviso
  if(interrumpida && Date.now() - interrumpida < 3500) setTimeout(seguirTrasSalir, 250);
}
window.addEventListener('blur', marcarSalida);
window.addEventListener('pagehide', marcarSalida);
document.addEventListener('visibilitychange', function(){ if(document.hidden) marcarSalida(); });
function trasInterrupcion(){
  if(!actual || pausaMia || paradoPorMi || viendoVideo || audio.ended) return;
  if(Date.now() - tSalida < 3500){ setTimeout(seguirTrasSalir, 300); return; }
  pausaAjena = Date.now();
  interrumpida = Date.now();
  MZ.huboInterrupcion = true;
  anotar('sonido', 'pausa por otra app (llegó ' + Math.round((Date.now() - tSalida) / 1000) + ' s después de salir): espero', actual.titulo);
  pintarEstado('En pausa · otra app está sonando');
  pintarBotones(false);
}
function reanudarTrasInterrupcion(){
  linea('reanudarTrasInterrupcion llamada (interrumpida=' + (interrumpida ? Math.round((Date.now() - interrumpida) / 1000) + ' s' : 'no') + ')');
  var hace = Date.now() - interrumpida;
  if(!interrumpida){ return; }
  if(hace > 20 * 60 * 1000){            // pasó mucho rato: no arranca sola de repente, pero el ▶ queda a mano
    if(actual && audio.paused && !pausaMia && !paradoPorMi && !viendoVideo) quedarEnPausaVisible();
    return;
  }
  if(!actual || !audio.paused || pausaMia || paradoPorMi || viendoVideo){ interrumpida = 0; return; }
  interrumpida = 0; pintarEstado(null);
  anotar('sonido', 'el sonido vuelve a estar libre: sigo con ' + actual.titulo);
  try{ if(MZ.listo) MZ.ctx.resume(); }catch(_){}
  if(actual.tipo === 'radio'){ try{ audio.src = actual.url; }catch(_){} }       // en directo: se reengancha al directo
  var intentos = 0;
  (function volver(){
    if(!actual || !audio.paused || pausaMia || paradoPorMi){ linea('seguir: cancelado (ya suena o lo paré yo)'); return; }
    linea('seguir: intento de play() nº ' + (intentos + 1) + (document.hidden ? ' [en segundo plano]' : ''));
    var p = audio.play();
    if(p && p.then) p.then(function(){ linea('seguir: play() aceptado'); });
    if(p && p.catch) p.catch(function(er){
      linea('play() tras la interrupción rechazado: ' + (er && er.name));
      if(++intentos < 3) reintentarSiDespierto(volver, 800 * intentos);
      else{ interrumpida = Date.now(); pintarEstado('Toca la pantalla para seguir'); }
    });
  })();
}
try{
  if(navigator.audioSession && navigator.audioSession.addEventListener){
    navigator.audioSession.addEventListener('statechange', function(){
      var st = navigator.audioSession.state;
      anotar('sonido', 'iOS dice: ' + st, actual ? actual.titulo : '');      // para ver en el informe qué pasa de verdad
      // En iOS 18.7 el estado llega como «undefined», pero el AVISO sí llega: el primero es el
      // principio de la interrupción y los siguientes son el final (visto en el informe de Elibel).
      // Pasados unos segundos desde la pausa, un aviso nuevo = la otra app terminó → seguir.
      if(interrumpida && (st === 'active' || Date.now() - interrumpida > 2500)){
        linea('aviso de iOS tras la pausa (' + Math.round((Date.now() - interrumpida) / 1000) + ' s): voy a intentar seguir');
        clearTimeout(window.__tReanuda);
        window.__tReanuda = setTimeout(reanudarTrasInterrupcion, 1500);
      }
    });
  }
}catch(_){}
audio.addEventListener('playing', function(){ interrumpida = 0; if(MZ.listo && MZ.huboInterrupcion){ MZ.huboInterrupcion = false; setTimeout(comprobarSonidoMezcla, 2500); } });
/* Una vez que la otra app termina, la web no recibe ningún aviso en segundo plano (iOS la
   «duerme»): a veces iOS reanuda la música solo, y si no, hay tres formas de seguir —
   volver a la app (se reanuda sola), tocar CUALQUIER sitio de la pantalla, o el botón ▶ de la
   pantalla de bloqueo / Centro de control / coche. */
['focus','pageshow'].forEach(function(n){
  window.addEventListener(n, function(){ if(interrumpida) setTimeout(reanudarTrasInterrupcion, 600); });
});
document.addEventListener('pointerdown', function(){
  if(interrumpida && actual && audio.paused && !pausaMia && !paradoPorMi) reanudarTrasInterrupcion();     // el toque cuenta como permiso de iOS
}, true);
/* Volver a la app (tras una llamada, la cámara, WhatsApp…): si la música se paró por
   una interrupción y ya nada más suena, sigue. Si iOS no avisa por Audio Session. */
document.addEventListener('visibilitychange', function(){
  if(document.hidden || !interrumpida) return;
  setTimeout(function(){
    var ses = navigator.audioSession && navigator.audioSession.state;
    if(ses === 'interrupted') return;                 // iOS dice que sigue ocupado: se espera
    reanudarTrasInterrupcion();
  }, 900);
});

/* ─── Audio «fantasma» (fallo de Elibel y Emmanuel, 2/10/2026) ──────
   Tras un audio de WhatsApp, iOS a veces deja el <audio> con paused=false pero MUDO y sin avanzar,
   y sin avisar con ningún «pause». Efectos: la app enseña ⏸ aunque no suena, play() no hace nada
   (cree que ya suena), y la pantalla de bloqueo/coche se queda sin ficha. Ningún reintento
   anterior lo veía porque todos miraban audio.paused. Ahora: al volver, al tocar y cuando iOS
   avisa de un cambio de sonido, se MIDE si el tiempo avanza; si no, se hace pausa+play (o se
   recarga la fuente) y, si iOS no deja, se enseña ▶ de verdad. */
var revisandoFantasma = false, intentosFantasma = 0;
function volverAPonerFicha(){
  try{
    if(!('mediaSession' in navigator) || !navigator.mediaSession.metadata) return;
    var m = navigator.mediaSession.metadata;
    navigator.mediaSession.metadata = new MediaMetadata({title:m.title, artist:m.artist, album:m.album, artwork:m.artwork ? Array.prototype.slice.call(m.artwork) : []});
    navigator.mediaSession.playbackState = 'playing';
  }catch(_){}
}
function pausaLimpia(){
  // Dejarlo en pausa de verdad (con la ficha de bloqueo y el ▶ a mano): un toque o el ▶ de la
  // pantalla de bloqueo SÍ lo reanudan. Con la pantalla apagada iOS no deja cargar fuentes nuevas.
  pausaMia = true; try{ audio.pause(); }catch(_){}
  setTimeout(function(){ pausaMia = false; }, 900);
  interrumpida = Date.now(); intentosFantasma = 0;
  pintarBotones(false); pintarEstado('Toca ▶ para seguir');
  try{ navigator.mediaSession.playbackState = 'paused'; }catch(_){}
  linea('fantasma: no se pudo curar solo; queda en pausa limpia (▶)');
}
function reengancharAudio(){
  var t = audio.currentTime, nivel = intentosFantasma++, oculta = document.hidden;
  linea('fantasma: reenganche nivel ' + nivel + (oculta ? ' [en segundo plano]' : ''));
  if(nivel >= (oculta ? 2 : 3)){ pausaLimpia(); return; }
  reintentarSiDespierto(function(){ revisarFantasma('verificación'); }, 3200);
  pausaMia = true;                                         // este pause lo provoco yo: que no cuente como interrupción
  try{ audio.pause(); }catch(_){}
  // reactivar la sesión de audio de iOS (el atasco es de la sesión, no del archivo)
  try{ if(navigator.audioSession){ navigator.audioSession.type = 'auto'; navigator.audioSession.type = 'playback'; } }catch(_){}
  setTimeout(function(){ pausaMia = false; }, 1500);
  setTimeout(function(){
    if(!actual || paradoPorMi || viendoVideo) return;
    // solo con la app a la vista se permite recargar la fuente (nivel 1 en adelante)
    if(!oculta && (nivel >= 1 || actual.tipo === 'radio' || audio.error || audio.readyState === 0)){
      var src = actual.tipo === 'radio' ? actual.url : audio.src;
      try{ audio.load(); audio.src = src; }catch(_){}
      if(actual.tipo === 'cancion' && t > 1) audio.addEventListener('loadedmetadata', function(){ try{ audio.currentTime = t; }catch(_){} }, {once:true});
    }else if(actual.tipo === 'radio'){ try{ audio.src = actual.url; }catch(_){} }
    var p = audio.play();
    if(p && p.then) p.then(function(){ linea('fantasma: play() aceptado'); volverAPonerFicha(); });
    if(p && p.catch) p.catch(function(er){
      linea('fantasma: play() rechazado: ' + (er && er.name));
      pausaLimpia();
    });
  }, 450);
}
function revisarFantasma(motivo){
  if(revisandoFantasma || !actual || paradoPorMi || pausaMia || viendoVideo || audio.ended || audio.paused) return;
  revisandoFantasma = true;
  var t0 = audio.currentTime, id0 = actual.id, src0 = audio.currentSrc || audio.src;
  setTimeout(function(){
    revisandoFantasma = false;
    if(!actual || paradoPorMi || pausaMia || viendoVideo || audio.ended) return;
    // Cambió de canción (tocaste otra, pasó a la siguiente) mientras medía: no es un fantasma.
    if(actual.id !== id0 || (audio.currentSrc || audio.src) !== src0 || audio.currentTime < t0 - 0.5){ intentosFantasma = 0; return; }
    if(audio.paused){ pintarBotones(false); return; }                  // el botón dice la verdad
    if(audio.currentTime > t0 + 0.05){ pintarBotones(true); intentosFantasma = 0; return; }  // suena bien
    anotar('sonido', 'fantasma (' + motivo + '): la app creía que sonaba y no avanza; lo reengancho', actual.titulo);
    linea('fantasma detectado (' + motivo + ')');
    reengancharAudio();
  }, 1400);
}
document.addEventListener('visibilitychange', function(){ if(!document.hidden){ pintarBotones(!!actual && !audio.paused); revisarFantasma('volví a la app'); } });
['focus','pageshow'].forEach(function(n){ window.addEventListener(n, function(){ revisarFantasma(n); }); });
document.addEventListener('pointerdown', function(){ revisarFantasma('toque'); }, true);
try{
  if(navigator.audioSession && navigator.audioSession.addEventListener){
    navigator.audioSession.addEventListener('statechange', function(){
      setTimeout(function(){ revisarFantasma('iOS avisó (+2 s)'); }, 2000);
      setTimeout(function(){ revisarFantasma('iOS avisó (+6 s)'); }, 6000);
    });
  }
}catch(_){}

/* ─── Mantener la pantalla encendida (móvil en el soporte) ───────── */
var candado = null;
async function ponerCandado(activo){
  try{
    if(activo && 'wakeLock' in navigator){
      candado = await navigator.wakeLock.request('screen');
      candado.addEventListener('release', function(){ candado = null; });
    }else if(candado){ await candado.release(); candado = null; }
  }catch(err){ anotar('wakelock', err.message); }
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && AJ.pantalla && !candado) ponerCandado(true);
});

/* ─── MODO COCHE ─────────────────────────────────────────────────
   Botones enormes, cuatro cosas y nada más. Para no apartar la
   vista de la carretera. */
var enCoche = false;
function modoCoche(activar){
  enCoche = activar;
  document.body.classList.toggle('coche', activar);
  if(activar){
    $('now').classList.add('on');
    if(AJ.pantalla) ponerCandado(true);
    toast('🚗 Modo coche. Botones grandes.', 'bueno', 2600);
  }else{
    ponerCandado(false);
  }
}

/* La barra de abajo y el título: Radio vive dentro de Buscar, pero para quien mira es otra pantalla. */
function marcarBarra(){
  var donde = (vistaActual === 'buscar' && pestana === 'radio') ? 'radio' : vistaActual;
  var bs = document.querySelectorAll('#barra button');
  for(var k=0;k<bs.length;k++)
    bs[k].classList.toggle('on', bs[k].dataset.ir === donde || bs[k].dataset.barra === donde);
  var enRadio = vistaActual === 'buscar' && pestana === 'radio';
  var t = $('buscar-titulo'); if(t) t.textContent = enRadio ? 'Radio' : 'Buscar';
  var tb = $('tabs-b'); if(tb) tb.style.display = enRadio ? 'none' : '';
}
function ir(v){
  vistaActual = v;
  if(v !== 'buscar' && ytVerId){            // quitar el reproductor: si no, sigue bajando vídeo escondido
    ytVerId = null; viendoVideo = false; $('tab-cuerpo').innerHTML = '';
  }
  var vs = document.querySelectorAll('.view');
  for(var i=0;i<vs.length;i++) vs[i].classList.remove('on');
  var el = $('v-'+v);
  if(el){ el.classList.add('on'); el.scrollTop = 0; }
  marcarBarra();
  pintarVista();
}
function pintarVista(){
  if(vistaActual === 'inicio') pintarInicio();
  else if(vistaActual === 'buscar') pintarBuscar();
  else if(vistaActual === 'biblio') pintarBiblio();
  else if(vistaActual === 'ajustes') pintarAjustes();
}

/* Barra de «Sonando ahora»: se toca o se arrastra con el dedo. */
(function(){
  var caja = $('n-seek-caja'), arrastrando = false;
  function pos(e){
    var r = caja.getBoundingClientRect(), d = audio.duration || (actual && actual.dur) || 0;
    var f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    return {f:f, d:d};
  }
  function mover(e){
    if(!actual || actual.tipo !== 'cancion') return;
    var q = pos(e); if(!q.d) return;
    $('n-seek').style.width = (q.f * 100) + '%';
    $('n-a').textContent = tiempo(q.f * q.d);
  }
  caja.addEventListener('pointerdown', function(e){
    if(!actual || actual.tipo !== 'cancion') return;
    arrastrando = true; caja.dataset.arr = '1';
    try{ caja.setPointerCapture(e.pointerId); }catch(_){}
    mover(e); e.preventDefault();
  });
  caja.addEventListener('pointermove', function(e){ if(arrastrando) mover(e); });
  function soltar(e){
    if(!arrastrando) return;
    arrastrando = false; delete caja.dataset.arr;
    var q = pos(e);
    if(q.d){ try{ audio.currentTime = q.f * q.d; }catch(_){} }
    pintarProgreso();
  }
  caja.addEventListener('pointerup', soltar);
  caja.addEventListener('pointercancel', function(){ arrastrando = false; delete caja.dataset.arr; pintarProgreso(); });
})();

/* Quitar la reproducción: con la música PARADA, se desliza la barrita de abajo hacia la
   izquierda y desaparece (la música guardada no se toca; solo se olvida lo que sonaba). */
function quitarReproduccion(){
  paradoPorMi = true; viendoVideo = false; recuperarAlVolver = false;
  clearTimeout(reintento); clearTimeout(vigilante); dormir && clearTimeout(dormir);
  try{ if(MZ && MZ.puente) abortarPuente(); }catch(_){}
  try{ audio.pause(); }catch(_){}
  try{ audio.removeAttribute('src'); audio.load(); }catch(_){}
  soltarURLs(); soltarCaratula();
  actual = null; cola = []; colaPos = -1; sigPre = null;
  guardarCola();
  $('mini').classList.remove('on'); $('now').classList.remove('on');
  if('mediaSession' in navigator){
    try{ navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; }catch(_){}
  }
  pintarVista();
}
(function(){
  var mini = $('mini'), x0 = 0, y0 = 0, dx = 0, activo = false, mov = false;
  mini.addEventListener('pointerdown', function(e){
    if(!actual || !audio.paused) return;               // solo con la música parada
    if(e.target.closest && e.target.closest('#m-pp, #m-next')) return;
    activo = true; mov = false; x0 = e.clientX; y0 = e.clientY; dx = 0;
  });
  mini.addEventListener('pointermove', function(e){
    if(!activo) return;
    var ax = e.clientX - x0, ay = e.clientY - y0;
    if(!mov){
      if(Math.abs(ay) > 12 && Math.abs(ay) > Math.abs(ax)){ activo = false; return; }
      if(ax > -10) return;
      mov = true; mini.classList.add('mov');
    }
    dx = Math.min(0, ax);
    mini.style.transform = 'translateX(' + dx + 'px)';
    mini.style.opacity = String(Math.max(.25, 1 + dx / 300));
  });
  function fin(){
    if(!activo) return;
    activo = false;
    if(!mov) return;
    mini.classList.remove('mov');
    window.__swipe = Date.now();
    if(dx < -90){
      mini.style.transform = 'translateX(-110%)'; mini.style.opacity = '0';
      setTimeout(function(){ quitarReproduccion(); mini.style.transform = ''; mini.style.opacity = ''; }, 200);
    }else{ mini.style.transform = ''; mini.style.opacity = ''; }
  }
  mini.addEventListener('pointerup', fin);
  mini.addEventListener('pointercancel', fin);
})();

/* Deslizar una fila hacia la izquierda enseña ❤️ y 🗑 (canciones y emisoras). */
(function(){
  var fila = null, x0 = 0, y0 = 0, dx = 0, mov = false, abierta = null, ANCHO = 128;
  function cerrar(r){ if(r){ r.classList.remove('mov'); r.style.transform = ''; if(abierta === r) abierta = null; setTimeout(function(){ if(abierta !== r) r.classList.remove('abre'); }, 260); } }
  document.addEventListener('pointerdown', function(e){
    var r = e.target.closest ? e.target.closest('.row.desl') : null;
    if(abierta && abierta !== r && !(e.target.closest && e.target.closest('.swb'))) cerrar(abierta);
    if(!r || (e.target.closest && e.target.closest('.swb'))) { fila = null; return; }
    fila = r; x0 = e.clientX; y0 = e.clientY; dx = 0; mov = false;
  });
  document.addEventListener('pointermove', function(e){
    if(!fila) return;
    var ax = e.clientX - x0, ay = e.clientY - y0;
    if(!mov){
      if(Math.abs(ay) > 12 && Math.abs(ay) > Math.abs(ax)){ fila = null; return; }   // era para desplazar la lista
      if(Math.abs(ax) < 10) return;
      mov = true; fila.classList.add('mov'); fila.classList.add('abre');
    }
    var base = (abierta === fila) ? -ANCHO : 0;
    dx = Math.max(-ANCHO - 24, Math.min(0, base + ax));
    fila.style.transform = 'translateX(' + dx + 'px)';
  });
  function fin(){
    if(!fila) return;
    var r = fila; fila = null;
    if(!mov) return;
    r.classList.remove('mov');
    if(dx < -ANCHO / 2){ if(abierta && abierta !== r) cerrar(abierta); r.style.transform = 'translateX(' + (-ANCHO) + 'px)'; abierta = r; }
    else cerrar(r);
    window.__swipe = Date.now();          // el toque que acaba un deslizamiento no abre la fila
  }
  document.addEventListener('pointerup', fin);
  document.addEventListener('pointercancel', fin);
  document.addEventListener('click', function(e){
    if(window.__swipe && Date.now() - window.__swipe < 350){ e.stopPropagation(); e.preventDefault(); window.__swipe = 0; }
    else if(abierta && e.target.closest && e.target.closest('.row.desl') === abierta && !e.target.closest('.swb')){ e.stopPropagation(); e.preventDefault(); cerrar(abierta); }
  }, true);
  document.addEventListener('scroll', function(){ if(abierta) cerrar(abierta); }, true);
})();

function buscarCancion(id){
  for(var i=0;i<CANCIONES.length;i++) if(CANCIONES[i].id === id) return CANCIONES[i];
  return null;
}
function buscarLista(id){
  for(var i=0;i<LISTAS.length;i++) if(LISTAS[i].id === id) return LISTAS[i];
  return null;
}

            ? 'Toca las que quieras: se van metiendo al momento.'
            : 'Ya tienes toda tu música en esta lista.') + '</div>';
  h += fuera.map(function(c){
    return '<button class="opc" data-meter="'+esc(l.id)+'" data-mete-id="'+esc(c.id)+'">'+
      '<span class="em">➕</span><span class="tx"><b>'+esc(c.titulo)+'</b>'+
      '<small>'+esc(c.artista)+'</small></span></button>';
  }).join('');
  h += '<button class="opc" data-cerrar-hoja="1"><span class="em">✓</span>' +
       '<span class="tx"><b>Listo</b></span></button>';
  abrirHoja(h);
}

/* Cuanto mide de verdad esta pantalla. env() no se puede leer con
   getComputedStyle (devuelve el texto sin resolver), asi que se mide con un
   elemento de mentira. Esto existe por el hueco negro de abajo que se ve en
   el iPhone de Emmanuel y que NO se reproduce en el ordenador. */
function envReal(prop){
  try{
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:env(' + prop + ',0px)';
    document.body.appendChild(d);
    var h = d.getBoundingClientRect().height;
    d.remove();
    return Math.round(h * 10) / 10;
  }catch(_){ return -1; }
}
function medidaBarra(){
  try{
    var b = $('barra').getBoundingClientRect();
    return Math.round(b.top) + ' → ' + Math.round(b.bottom) + '  (alto ' + Math.round(b.height) + ')';
  }catch(_){ return '?'; }
}
function huecoAbajo(){
  try{
    var b = $('barra').getBoundingClientRect();
    return Math.round(innerHeight - b.bottom);
  }catch(_){ return -1; }
}
function medidasPantalla(){
  var b = null;
  try{ b = $('barra').getBoundingClientRect(); }catch(_){}
  var vv = window.visualViewport;
  var cs = getComputedStyle(document.documentElement);
  var L = [];
  L.push(' ventana: ' + innerWidth + ' x ' + innerHeight);
  L.push(' pantalla: ' + screen.width + ' x ' + screen.height + '   dpr: ' + devicePixelRatio);
  L.push(' visualViewport: ' + (vv ? Math.round(vv.height) + ' (desplazado ' + Math.round(vv.offsetTop) + ')' : '(no hay)'));
  L.push(' html.clientHeight: ' + document.documentElement.clientHeight +
         '   body.clientHeight: ' + document.body.clientHeight);
  try{ L.push(' #app alto: ' + Math.round($('app').getBoundingClientRect().height)); }
  catch(_){ L.push(' #app alto: ?'); }
  L.push(' safe-area arriba/abajo REAL: ' + envReal('safe-area-inset-top') + ' / ' + envReal('safe-area-inset-bottom'));
  L.push(' --sabn: ' + cs.getPropertyValue('--sabn').trim() + '   --barra: ' + cs.getPropertyValue('--barra').trim());
  if(b){
    L.push(' barra: arriba ' + Math.round(b.top) + '  abajo ' + Math.round(b.bottom) + '  alto ' + Math.round(b.height));
    L.push(' >>> HUECO DEBAJO DE LA BARRA: ' + Math.round(innerHeight - b.bottom) + ' px <<<');
  }else{
    L.push(' barra: no se pudo medir');
  }
  return L.join('\n');
}
async function textoInforme(){
  var e = [];
  try{ e = JSON.parse(localStorage.getItem(CAJA)||'[]'); }catch(_){}
  var sw = 'sin service worker', caches_ = '';
  try{
    if('serviceWorker' in navigator){
      var regs = await navigator.serviceWorker.getRegistrations();
      sw = (navigator.serviceWorker.controller ? 'controla la app' : 'registrado pero NO controla') + ' · ' + regs.length + ' registro(s)';
    }
    if(window.caches) caches_ = (await caches.keys()).join(', ');
  }catch(_){}
  var cuota = '';
  try{ var es = await navigator.storage.estimate(); cuota = mbTxt(es.usage || 0) + ' de ' + mbTxt(es.quota || 0); }catch(_){}
  var pers = '?';
  try{ pers = navigator.storage && navigator.storage.persisted ? String(await navigator.storage.persisted()) : 'no disponible'; }catch(_){}
  var ses = '';
  try{ ses = navigator.audioSession ? navigator.audioSession.state + ' (tipo ' + navigator.audioSession.type + ')' : 'no disponible'; }catch(_){ ses = '?'; }
  var bloq = '';
  try{ bloq = localStorage.getItem('mm_bloqueado') || '(sin fijar)'; }catch(_){}
  return 'MI MÚSICA — informe\nVersión: '+APP_VERSION+'\nFecha: '+new Date().toLocaleString('es')+
    '\nPersona: '+yo+' · perfil fijado: '+bloq+'\nDirección: '+location.href+
    '\nNavegador: '+navigator.userAgent+
    '\nInstalada: '+(window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches)+
    '\nCanciones: '+CANCIONES.length+' · Online: '+navigator.onLine+
    '\nService worker: '+sw+'\nCachés: '+caches_+
    '\nAlmacenamiento: '+cuota+' · protegido: '+pers+
    '\nSesión de audio de iOS: '+ses+
    '\nMezcla: '+(AJ.mezcla ? 'activada' : 'apagada')+' · ahorro de datos: '+(AJ.ahorro ? 'sí' : 'no')+
    '\nSuena ahora: '+(actual ? actual.tipo+' · '+actual.titulo+(audio.paused ? ' (en pausa)' : '') : 'nada')+
    '\n\nLÍNEA DE TIEMPO DEL SONIDO (lo último abajo):\n' + LINEA.slice(-45).join('\n') +
    '\n\nMEDIDAS DE LA PANTALLA:\n' + medidasPantalla() +
    '\n\nÚLTIMOS AVISOS Y ERRORES:\n' + (e.length ? e.slice(0,30).map(function(x){
      return x.f+' · '+x.o+' · '+x.m+(x.n > 1 ? ' (×'+x.n+')' : ''); }).join('\n') : '(ninguno)');
}
async function copiarInforme(){
  var txt = await textoInforme();
  // En el iPhone se abre la hoja de compartir: se manda directo por WhatsApp.
  if(navigator.share){
    try{ await navigator.share({title:'Informe de Mi Música', text:txt}); return; }
    catch(err){ if(err && err.name === 'AbortError') return; }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      toast('Informe copiado. Pégalo en un WhatsApp.', 'bueno', 5000);
    }).catch(function(){ alert(txt); });
  }else alert(txt);
}

/* Pantalla de emergencia: además del error, dice cuánto ocupa la app y si parece falta de espacio. */
async function detalleSeguro(mensaje){
  var t = String(mensaje || ''), ocupa = '';
  try{
    var es = await navigator.storage.estimate();
    ocupa = '\nLa app ocupa ' + mbTxt(es.usage || 0) + ' de ' + mbTxt(es.quota || 0) + ' permitidos.';
  }catch(_){}
  var espacio = /quota|storage|space|disk|full|lleno|espacio|open database/i.test(t);
  $('s-log').textContent = (espacio
    ? '⚠️ El iPhone no dejó abrir el almacenamiento de la app. Suele ser por poco espacio libre o porque el teléfono estaba bloqueado.\n1) Desbloquea el iPhone y toca «Reintentar».\n2) Si sigue: Ajustes → General → Almacenamiento del iPhone y libera sitio (lo que más ocupa suelen ser las descargas de WhatsApp, Telegram u OneDrive).\n\n'
    : '') + t + ocupa;
}
/* Una app instalada en el iPhone puede pasar días «dormida» con la versión vieja.
   Aquí se mira la versión publicada: si hay una nueva, se pone sola cuando no
   suena nada (o en cuanto se pare la música). Así Elibel y Emmanuel van iguales. */
var actualizacionPendiente = false, ultimaBusqueda = 0;
async function buscarActualizacion(forzar){
  if(!navigator.onLine) return false;
  if(!forzar && Date.now() - ultimaBusqueda < 10 * 60 * 1000) return false;
  ultimaBusqueda = Date.now();
  try{
    var r = await fetch('index.html?v=' + Date.now(), {cache: 'no-store'});
    var t = await r.text();
    var m = t.match(/APP_VERSION = '([\d.]+)'/);
    if(!m || m[1] === APP_VERSION) return false;
    anotar('actualizar', 'hay versión nueva ' + m[1] + ' (esta es ' + APP_VERSION + ')');
    actualizacionPendiente = true;
    aplicarActualizacion(m[1]);
    return true;
  }catch(_){ return false; }
}
function aplicarActualizacion(v){
  if(!actualizacionPendiente) return;
  if(actual && !audio.paused){
    toast('Hay una versión nueva (' + v + '). Se pondrá en cuanto pares la música.', 'bueno', 4500);
    return;
  }
  actualizacionPendiente = false;
  toast('Poniendo la versión nueva…', 'bueno', 1500);
  setTimeout(reparar, 900);
}
audio.addEventListener('pause', function(){ if(actualizacionPendiente && !audio.ended) setTimeout(function(){ if(audio.paused) aplicarActualizacion(''); }, 1500); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden) buscarActualizacion(false); });

function reparar(){
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.controller){
      navigator.serviceWorker.controller.postMessage({tipo:'LIMPIAR'});
      setTimeout(function(){ arranqueOK(); location.reload(true); }, 900);
    }else{
      caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }).then(function(){ arranqueOK(); location.reload(true); });
    }
  }catch(err){ arranqueOK(); location.reload(); }
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', function(e){
    if(e.data && e.data.tipo === 'LIMPIO'){ arranqueOK(); location.reload(); }
  });
}

function guardarAjustes(){
  try{ localStorage.setItem('mm_ajustes', JSON.stringify(AJ)); }catch(_){}
}
function cargarAjustes(){
  try{ AJ = JSON.parse(localStorage.getItem('mm_ajustes') || '{}') || {}; }catch(_){ AJ = {}; }
  // La mezcla (Web Audio) se retiró en la 1.37.3: en CarPlay metía un zumbido/hormigueo de baja calidad
  // en todo el sonido y no dejaba reanudar tras una interrupción. Se apaga aunque estuviera guardada.
  if(AJ.mezcla){ AJ.mezcla = false; try{ localStorage.setItem('mm_ajustes', JSON.stringify(AJ)); }catch(_){} }
  ponerEscala(AJ.letra);
  ponerColor(AJ.color);
}
/* El tamano de toda la letra de la app. Un solo numero: cada font-size del
   CSS es calc(Npx * var(--esc)), asi que esto lo mueve todo a la vez. */
var LETRAS = [['normal', 1.12, 'Normal'],
              ['grande', 1.26, 'Grande'],
              ['enorme', 1.42, 'Muy grande']];
function ponerEscala(cual){
  var e = 1.12;
  for(var i=0;i<LETRAS.length;i++) if(LETRAS[i][0] === cual) e = LETRAS[i][1];
  try{ document.documentElement.style.setProperty('--esc', e); }catch(_){}
}

/* ═════════════════ ARRANQUE ═════════════════════════════════════ */
/* Si se abre con ?p=emmanuel o ?p=elibel, entra directa a ese perfil.
   Es lo que hace que elibel.html sea de verdad "su" app: su icono, su
   nombre debajo y su música, sin tener que elegir cada vez. */
function perfilPedido(){
  try{
    var m = String(location.search || '').match(/[?&]p=(emmanuel|elibel)\b/i);
    return m ? m[1].toLowerCase() : '';
  }catch(_){ return ''; }
}
async function arrancar(){
  // Guardián 8 y 9: ¿falló dos veces seguidas?
  if(fallos() >= 2){
    $('carga').classList.add('oculto');
    $('seguro').classList.add('on');
    var e = [];
    try{ e = JSON.parse(localStorage.getItem(CAJA)||'[]'); }catch(_){}
    detalleSeguro(e.slice(0,6).map(function(x){ return x.o+': '+x.m; }).join('\n') || '(sin detalles)');
    return;
  }
  marcarArranque();

  try{
    cargarAjustes();
    iniciarMezcla();
    var abierta = false, ultimoErr = null;
    for(var intento = 0; intento < 6 && !abierta; intento++){
      try{ await abrirDB(); abierta = true; }
      catch(err){
        ultimoErr = err;
        anotar('abrirDB', 'intento ' + (intento + 1) + ': ' + ((err && (err.message || err.name)) || err));
        await new Promise(function(q){ setTimeout(q, 1500); });
      }
    }
    if(!abierta) throw (ultimoErr || new Error('no se pudo abrir el almacenamiento'));
    await pedirPersistencia();

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(function(err){ anotar('sw', err.message); });
      setTimeout(buscarActualizacion, 4000);
      var teniaControl = !!navigator.serviceWorker.controller, recargado = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!teniaControl || recargado) return;
        recargado = true;
        if(!actual || audio.paused) setTimeout(function(){ location.reload(); }, 400);
        else actualizacionPendiente = true;
      });
    }

    // Cada app es de una sola persona (ver cabecera): no hay «quién eres» ni «cambiar de persona».
    var guardado = (window.__QUIEN === 'elibel') ? 'elibel' : 'emmanuel';

    $('carga').classList.add('oculto');

    if(guardado && PERSONAS[guardado]){
      await entrar(guardado);
    }else{
      ir('quien');
    }

    // Arrancó bien
    arranqueOK();
    avisoSelector();

    // Aviso si no está instalada (los 7 días de Safari)
    var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if(!standalone && guardado){
      setTimeout(function(){
        toast('⚠️ Ábrela desde el <b>icono de la pantalla de inicio</b>.<br>En Safari, iOS borra tu música a los 7 días.', 'malo', 9000);
      }, 2200);
    }
  }catch(err){
    anotar('arranque', err.message, err.stack);
    $('carga').classList.add('oculto');
    $('seguro').classList.add('on');
    detalleSeguro(err.name + ': ' + err.message + '\n' + (err.stack||'').slice(0,300));
  }
}

document.addEventListener('visibilitychange', function(){
  if(document.hidden || !actual) return;
  // Al volver a la app se revive SOLO lo que se murió de fondo. Si la
  // paraste tú, se queda parada: antes se encendía sola cada vez que
  // abrías la app y era insufrible.
  if(paradoPorMi || viendoVideo) return;
  if(recuperarAlVolver){
    recuperarAlVolver = false; intentosVigilante = 0;
    if(actual.tipo === 'radio'){ espera = 500; fallosRadio = 0; programarReconexion(); }
    else if(audio.paused){ var q = audio.play(); if(q && q.catch) q.catch(function(){}); }
    return;
  }
  if(actual.tipo === 'radio' && audio.paused && fallosRadio < 10){
    espera = 500; programarReconexion();
  }
});

arrancar();
