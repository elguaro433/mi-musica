<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mi Música</title>
<meta name="description" content="Tu música, tuya de verdad. Sin internet, en el coche y con tu nombre.">
<script>
/* Cada persona tiene SU enlace y SU app: el perfil queda fijado (mm_bloqueado) y nunca se pregunta quién eres.
   Esto va aquí arriba para que el nombre y el icono de «Añadir a inicio» sean los de esa persona. */
(function(){
  var q = '';
  try{ var m = String(location.search).match(/[?&]p=(emmanuel|elibel)(?![a-z])/i); if(m) q = m[1].toLowerCase(); }catch(_){}
  var quien = q;
  try{
    if(q) localStorage.setItem('mm_bloqueado', q);
    else quien = localStorage.getItem('mm_bloqueado') || localStorage.getItem('mm_perfil') || 'emmanuel';
  }catch(_){ quien = quien || 'emmanuel'; }
  window.__QUIEN = (quien === 'elibel') ? 'elibel' : 'emmanuel';
  if(window.__QUIEN === 'elibel') document.write('<link rel="manifest" href="manifest-elibel.json">');
  else document.write('<link rel="manifest" href="manifest.json">');
})();
</script>
<meta name="theme-color" content="#0b0913">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>document.write('<meta name="apple-mobile-web-app-title" content="' + (window.__QUIEN === 'elibel' ? 'Elibel' : 'Emmanuel') + '">');</script>
<link rel="apple-touch-icon" href="icon-180.png">
<!-- Pantallas de arranque: sin fogonazo blanco al abrir desde el icono.
     iOS elige la del aparato exacto segun ancho, alto y densidad. -->
<link rel="apple-touch-startup-image" href="splash-393x852.png"
  media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="splash-440x956.png"
  media="(device-width:440px) and (device-height:956px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="splash-402x874.png"
  media="(device-width:402px) and (device-height:874px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="splash-430x932.png"
  media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="splash-375x812.png"
  media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="apple-touch-startup-image" href="splash-390x844.png"
  media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
<link rel="icon" href="icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600&display=swap">
<style>
:root{
  color-scheme:dark;
  /* Marcos y letras subidos el 29/09/2026: los bordes daban 1,3:1 sobre la
     tarjeta (invisibles) y la tarjeta 1,09:1 sobre el fondo (no se separaba).
     --pista es aparte para que las barras y los interruptores apagados no
     se vuelvan brillantes con el marco. */
  --bg:#0b0913; --bg2:#120e1e; --card:#1e1736; --card2:#271e47; --line:#6b5a9c;
  --pista:#352b55;
  --glow1:#241640; --glow2:#2a1030;
  --ink:#f6f2ff; --muted:#cdc5e2; --dim:#aea4c9;
  /* La escala de la letra. 1 era el tamano de la v1.5; Emmanuel dijo que
     todo se veia pequeno, asi que el normal ahora es 1.12. El interruptor
     de Ajustes mueve esto y no hay que tocar ni un font-size mas. */
  --esc:1.12;
  --purple:#a970ff; --pink:#ff5fa6; --cyan:#43e0d0; --gold:#ffcf5c; --red:#ff6b6b;
  --font-d:'Sora',system-ui,-apple-system,sans-serif;
  --font-b:'DM Sans',system-ui,-apple-system,sans-serif;
  --font-s:'Caveat',cursive;
  /* Isla dinámica / notch arriba, indicador de inicio abajo, y los bordes
     laterales en horizontal. Sin viewport-fit=cover estos valen 0. */
  --sat:env(safe-area-inset-top,0px);   --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);  --sar:env(safe-area-inset-right,0px);
  /* El colchon de la rayita de inicio: iOS da 34px, pero eso deja una franja
     negra enorme debajo de los botones. 16px basta para no pisarla.
     (fallo del 29/09/2026: "sobra espacio en la parte de abajo") */
  --sabn:min(var(--sab), 16px);
  --barra:calc(60px + var(--sabn));
  --gutter:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* svh = la altura pequeña, la que SIEMPRE está visible aunque asome la barra
   de Safari. Es la que garantiza que nada quede tapado. dvh como refuerzo
   para cuando la barra se esconde. */
html,body{margin:0;padding:0;height:100%;height:100svh;overflow:hidden;overscroll-behavior:none}
@supports (height:100dvh){ html,body{height:100dvh} }
/* OJO: este color NO es el fondo de la app (ese lo pone #app, que va
   encima). Este es el color con el que iOS pinta la franja que le sobra por
   abajo, porque da una ventana 59 px mas corta que la pantalla. Por eso
   lleva el color de la BARRA: asi la barra parece llegar hasta el borde.
   (el hueco negro del 29/09/2026 — medido en su iPhone, no supuesto) */
body{background:var(--bg2);color:var(--ink);font-family:var(--font-b);line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit}

#app{position:fixed;inset:0;z-index:0;background:
  radial-gradient(620px 340px at 88% -8%, var(--glow1) 0%, transparent 62%),
  radial-gradient(520px 320px at -14% 12%, var(--glow2) 0%, transparent 58%), var(--bg)}

.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sat) + 10px) calc(var(--gutter) + var(--sar))
          calc(var(--barra) + 84px) calc(var(--gutter) + var(--sal));
  display:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.on{display:block}

/* ---------- quién eres ---------- */
#v-quien{padding:0}
#v-quien.on{display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:calc(var(--sat) + 24px) calc(28px + var(--sar)) calc(var(--sab) + 24px) calc(28px + var(--sal))}
.q-logo{width:min(66vw,260px);height:auto;display:block;margin-bottom:-6px}
.q-title{font-family:var(--font-d);font-weight:700;font-size:calc(30px * var(--esc));letter-spacing:-.02em;margin-top:6px}
.q-sub{color:var(--muted);font-size:calc(14px * var(--esc));text-align:center;margin:6px 0 26px;max-width:24ch}
.q-btn{font-size:calc(21px * var(--esc));font-weight:600;width:100%;max-width:340px;display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:17px;padding:15px 17px;margin-bottom:12px;cursor:pointer;
  font-size:calc(16px * var(--esc));text-align:left}
.q-btn:active{background:var(--card2);border-color:var(--purple)}
.q-btn .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-d);font-weight:700;font-size:calc(18px * var(--esc));color:#120e1e;flex:0 0 auto}
.q-btn small{display:block;color:var(--dim);font-size:calc(12px * var(--esc));font-weight:400}
.av-e{background:linear-gradient(135deg,#a970ff,#7b4ddb)}
.av-l{background:linear-gradient(135deg,#ff5fa6,#ff8fc4)}
.q-foot{margin-top:16px;font-size:calc(11.5px * var(--esc));color:var(--dim);text-align:center;line-height:1.55}

/* ---------- cabeceras ---------- */
/* La cabecera pintaba una banda opaca del ancho del contenido ENCIMA del
   resplandor del fondo, y se le veían los cantos: eso era el "marco" que
   salía en el iPhone (29/09/2026). Ahora va a sangre, es traslúcida y se
   desvanece por abajo, así que no tiene ni un borde. */
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  position:sticky;top:0;z-index:20;
  margin:0 calc(-1 * (var(--gutter) + var(--sar))) 0 calc(-1 * (var(--gutter) + var(--sal)));
  padding:10px calc(var(--gutter) + var(--sar)) 18px calc(var(--gutter) + var(--sal))}
/* El desvanecido va SOLO en el fondo. Antes la mascara se comia tambien el
   texto, y por eso el saludo con su nombre salia lavado y no habia forma de
   leerlo. (fallo del 29/09/2026) */
.vhead::before{content:'';position:absolute;inset:0;z-index:-1;
  background:rgba(11,9,19,.96);
  background:color-mix(in srgb, var(--bg) 96%, transparent);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  -webkit-mask-image:linear-gradient(to bottom,#000 66%,rgba(0,0,0,0));
          mask-image:linear-gradient(to bottom,#000 66%,rgba(0,0,0,0))}
/* Sin backdrop-filter (navegador viejo) mejor opaco que ilegible. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .vhead::before{background:var(--bg)}
}
.vhead h2{font-family:var(--font-d);font-weight:700;font-size:calc(27px * var(--esc));margin:0;letter-spacing:-.02em;line-height:1.15}
.vhead .sal{font-size:calc(16.5px * var(--esc));color:var(--ink);font-weight:600;margin-bottom:2px;letter-spacing:-.01em}
.gear{width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:var(--card);
  border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;font-size:calc(17px * var(--esc))}
.shelf-t{font-family:var(--font-d);font-weight:600;font-size:calc(16.5px * var(--esc));margin:24px 0 11px;
  display:flex;align-items:center;gap:8px}

/* ---------- filas ---------- */
.row{display:flex;align-items:center;gap:13px;padding:10px 0;cursor:pointer;border-radius:11px}
.row:active{background:rgba(169,112,255,.1)}
.row.sonando .r-t{color:var(--purple)}
.row.falta{opacity:.45}
.chipauto{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 20px 10px 16px;border-radius:30px;
  background:var(--card);border:1px solid var(--line);color:var(--ink,#f6f2ff);font-size:calc(16px * var(--esc));font-weight:600;cursor:pointer}
.chipauto:active{transform:scale(.96)}
.chipauto.principal{background:linear-gradient(135deg,rgba(169,112,255,.28),rgba(255,95,166,.22));border-color:rgba(169,112,255,.6);
  box-shadow:0 4px 18px rgba(169,112,255,.25)}
#mini{touch-action:pan-y;transition:transform .2s ease,opacity .2s}
#mini.mov{transition:none}
.row.desl{position:relative;touch-action:pan-y;transition:transform .22s ease}
.row.desl.mov{transition:none}
.swa{display:none;position:absolute;left:100%;top:3px;bottom:3px;width:128px;gap:6px;padding-left:8px;box-sizing:border-box}
.row.desl.abre .swa{display:flex}
.swb{flex:1;display:grid;place-items:center;font-size:25px;border-radius:13px}
.swb.fav{background:rgba(255,95,166,.22)}
.swb.del{background:#ff5f7a}
#yt-host{position:absolute;inset:0;width:100%;height:100%;border:0}
.r-i{flex:0 0 auto;font-size:15px;opacity:.9}
.view{overflow-x:hidden}
.art{width:54px;height:54px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  font-size:calc(18px * var(--esc));overflow:hidden;background-size:cover;background-position:center}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art.ch{width:34px;height:34px;border-radius:7px;font-size:14px}
.art.vacia{font-size:calc(22px * var(--esc));text-shadow:0 2px 6px rgba(0,0,0,.35)}
.art.vacia.g{font-size:calc(46px * var(--esc))}
.art img.logo{object-fit:contain;padding:3px}
.r-x{min-width:0;flex:1;overflow:hidden}
.r-t{display:block;font-weight:500;font-size:calc(15px * var(--esc));white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-family:var(--font-d)}
.r-s{font-size:calc(12.5px * var(--esc));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:5px;min-width:0}
.badge{font-size:calc(11px * var(--esc));flex:0 0 auto}
.cal{font-size:calc(11px * var(--esc));font-weight:700;letter-spacing:.04em;color:var(--dim);
  border:1px solid var(--line);border-radius:4px;padding:0 4px;flex:0 0 auto}
.est{font-size:calc(11px * var(--esc));color:var(--cyan);flex:0 0 auto;letter-spacing:.04em}
/* Dentro de .r-s (que es flex) un texto suelto NO se encoge, asi que empujaba
   la calidad y las estrellas fuera de la pantalla. Esto es lo que cede. */
.enc{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-a{flex:0 0 auto;color:var(--dim);font-size:calc(17px * var(--esc));padding:13px 12px;margin:-13px -7px;min-width:46px;box-sizing:border-box;text-align:center}
.r-a.on{color:var(--pink)}
.hscroll{display:flex;gap:13px;overflow-x:auto;scrollbar-width:none;
  margin-left:calc(-1 * (var(--gutter) + var(--sal)));margin-right:calc(-1 * (var(--gutter) + var(--sar)));
  padding:0 calc(var(--gutter) + var(--sar)) 4px calc(var(--gutter) + var(--sal))}
.hscroll::-webkit-scrollbar{display:none}
.tile{width:124px;flex:0 0 auto;cursor:pointer}
.tile .art{width:124px;height:124px;font-size:calc(38px * var(--esc));border-radius:13px}
.tile .t{display:block;font-size:calc(13px * var(--esc));font-weight:500;margin-top:8px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-family:var(--font-d)}
.tile .s{display:block;font-size:calc(11.5px * var(--esc));color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

/* ---------- buscador (arriba de Buscar) ---------- */
.busca{position:relative;margin:0 0 12px}
.busca .lupa{position:absolute;left:17px;top:50%;transform:translateY(-54%);font-size:calc(22px * var(--esc));
  color:var(--dim);pointer-events:none;line-height:1}
.busca .campo{margin:0;padding:14px 16px 14px 46px;border-radius:30px;background:var(--card2);
  border:1px solid var(--line);min-height:50px}
.busca .campo::-webkit-search-cancel-button{-webkit-appearance:none}
.tile.sk .art{background:var(--card2);animation:pulso 1.3s ease-in-out infinite}
.tile.sk .t,.tile.sk .s{background:var(--card2);border-radius:6px;animation:pulso 1.3s ease-in-out infinite;
  color:transparent;width:70%;margin-top:8px}
@keyframes pulso{0%,100%{opacity:.55}50%{opacity:1}}
a.opc{text-decoration:none;color:inherit}
a.btn{display:block;text-align:center;text-decoration:none;box-sizing:border-box}

.tab svg.ti{vertical-align:-4px;margin-right:5px}
/* Favoritas: la pestaña del corazon, mas grande que las otras */
.tabs.fijas.cinco .tab.fav{font-size:calc(13px * min(var(--esc), 1.1));font-weight:700}
.tabs.fijas.cinco .tab.fav svg{vertical-align:-4px;margin-right:4px}
.r-a[data-fav],.r-a.on[data-au-fav],.r-a.on[data-fav-video],.r-a.on[data-aufav-quitar]{font-size:calc(23px * var(--esc))}

.tabs.fijas.tres{grid-template-columns:repeat(3,1fr)}
.tabs.fijas.tres .tab{font-size:calc(13px * min(var(--esc), 1.14));padding:10px 4px}
.seg{display:flex;gap:6px;margin:0 0 10px}
.sg{flex:1;min-height:40px;padding:8px 4px;border-radius:12px;background:transparent;border:1px solid var(--line);
  color:var(--muted);font-size:calc(13px * min(var(--esc), 1.14));font-weight:500;cursor:pointer}
.sg.on{background:var(--card2);color:var(--ink);border-color:var(--purple)}
.vermas{margin-left:auto;font-family:var(--font-b);font-size:calc(13px * var(--esc));font-weight:500;color:var(--purple);
  cursor:pointer;padding:8px 2px}
#bib-tools .busca{margin-bottom:10px}

.chk{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
  font-weight:800;font-size:16px;color:#120e1e;margin-right:-2px}
.chk.on{background:var(--purple);border-color:var(--purple)}
#bib-selbar{display:flex;gap:8px;margin:0 0 10px;justify-content:flex-end}
.sel-b{flex:0 0 auto;min-height:40px;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  color:var(--ink);font-size:calc(13.5px * min(var(--esc), 1.14));font-weight:600;cursor:pointer}
.sel-b.mal{background:#5a1f30;border-color:#8a2f48;color:#ffd5de;flex:1}
.sel-b.solido{flex:1;background:var(--purple);border:0;color:#120e1e;font-weight:700;display:flex;align-items:center;justify-content:center}
#bib-selbar{justify-content:stretch}
.sel-b[disabled]{opacity:.45}

/* ---------- pestañas y campos ---------- */
.tabs{display:flex;gap:8px;margin:2px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 15px;border-radius:30px;background:var(--card);
  border:1px solid var(--line);font-size:calc(13px * var(--esc));font-weight:500;cursor:pointer;color:var(--muted);
  min-height:44px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs.fijas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow:visible}
.tabs.fijas.cinco{grid-template-columns:1.4fr repeat(4,1fr);gap:4px}
.tabs.fijas.cinco .tab{padding:9px 1px;font-size:calc(10.5px * min(var(--esc), 1.1))}
@media (min-width:420px){ .tabs.fijas.cinco .tab{font-size:calc(11.5px * min(var(--esc), 1.1))} }
.tabs.fijas .tab{padding:9px 2px;font-size:calc(11.5px * min(var(--esc), 1.14));text-align:center;min-width:0;letter-spacing:-.01em}
@media (min-width:420px){ .tabs.fijas .tab{font-size:calc(12.5px * min(var(--esc), 1.14));padding:9px 6px} }
.tab.on{background:var(--purple);border-color:var(--purple);color:#120e1e;font-weight:700}
.campo{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:12px 14px;color:var(--ink);font-family:inherit;font-size:calc(16px * var(--esc));margin-bottom:8px}
.campo::placeholder{color:var(--dim)}
.campo:focus{outline:none;border-color:var(--purple)}
.city{font-family:var(--font-d);font-weight:600;font-size:calc(13px * var(--esc));color:var(--purple);
  letter-spacing:.09em;text-transform:uppercase;margin:19px 0 7px;display:flex;align-items:center;gap:7px}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:12px;padding:12px 14px;font-size:calc(12.5px * var(--esc));color:var(--muted);margin:14px 0;line-height:1.55}
.note b{color:var(--ink);font-weight:500}
.note.malo{border-left-color:var(--red)}
.note.bueno{border-left-color:var(--cyan)}
.btn{width:100%;background:var(--card2);border:1px dashed var(--line);border-radius:14px;
  padding:14px;color:var(--muted);font-size:calc(14.5px * var(--esc));cursor:pointer;margin-top:16px;font-weight:500}
.btn:active{border-color:var(--purple);color:var(--ink)}
.btn.solido{background:var(--purple);border:0;color:#120e1e;font-weight:700}
.btn.suave{background:linear-gradient(120deg,#2a1f47,#3a1730);border:1px solid var(--line);color:var(--ink)}
.vacio{text-align:center;color:var(--dim);font-size:calc(13.5px * var(--esc));padding:34px 14px;line-height:1.6}
.vacio .em{font-size:calc(36px * var(--esc));display:block;margin-bottom:10px}

/* ---------- tarjetas de ajustes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{font-family:var(--font-d);font-weight:600;font-size:calc(12.5px * var(--esc));margin:0 0 12px;color:var(--muted);
  letter-spacing:.07em;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;
  font-size:calc(14.5px * var(--esc));border-bottom:1px solid rgba(44,35,66,.55)}
.kv:last-child{border-bottom:0}
.kv .v{color:var(--muted);font-size:calc(13px * var(--esc));text-align:right}
.barra{height:8px;border-radius:5px;background:var(--pista);overflow:hidden;display:flex;margin:10px 0 8px}
.barra i{display:block;height:100%}
.leg{display:flex;gap:15px;font-size:calc(12px * var(--esc));color:var(--muted);flex-wrap:wrap}
.leg b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.guia p{margin:0 0 10px;font-size:calc(13.5px * var(--esc));color:var(--muted);line-height:1.6}
.guia p:last-child{margin-bottom:0}
.guia b{color:var(--ink);font-weight:500}
.guia .ojo{background:rgba(11,9,19,.5);border-left:2px solid var(--gold);border-radius:8px;
  padding:9px 11px;font-size:calc(12.5px * var(--esc));margin-top:12px}
.sign{font-family:var(--font-s);font-size:calc(27px * var(--esc));text-align:right;margin-top:8px}
.colores{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.col{border:2px solid transparent;border-radius:13px;height:58px;cursor:pointer;
  display:grid;place-items:end center;padding-bottom:5px;position:relative}
.col span{font-size:calc(11px * min(var(--esc),1.15));font-weight:700;color:#12101e;
  background:rgba(255,255,255,.72);border-radius:20px;padding:1px 9px}
.col.on{border-color:var(--ink);box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.perfil-card{display:flex;flex-direction:column;align-items:center;padding:22px 16px 18px}
.avatar-wrap{position:relative;width:96px;height:96px}
.av-toque{display:block;width:96px;height:96px;cursor:pointer;position:relative}
.av-toque .av{display:grid;box-shadow:0 6px 22px rgba(169,112,255,.35)}
.av-cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#a970ff,#ff5fa6);
  color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700;border:3px solid var(--bg,#120e1e)}
.av-x{position:absolute;right:-8px;top:-6px;width:30px;height:30px;border-radius:50%;background:#2a2140;color:#f6f2ff;
  display:grid;place-items:center;font-size:14px;border:2px solid var(--line,#3a2f57);cursor:pointer}
.perfil{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.perfil-x{min-width:0;flex:1}
.perfil-n{font-family:var(--font-d);font-weight:700;font-size:calc(18px * var(--esc));letter-spacing:-.01em}
.perfil-s{color:var(--dim);font-size:calc(12.5px * var(--esc));margin-top:2px}
.pista{color:var(--dim);font-size:calc(12px * var(--esc))}
.credito{font-size:calc(12px * var(--esc));color:var(--dim);line-height:1.65}
.credito b{color:var(--muted);font-weight:500}
.sw{position:relative;width:46px;height:27px;border-radius:20px;background:var(--pista);
  flex:0 0 auto;cursor:pointer;transition:.18s}
.sw::before{content:"";position:absolute;inset:-10px -8px;border-radius:24px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:var(--ink);transition:.18s}
.sw.on{background:var(--purple)}
.sw.on::after{transform:translateX(19px)}

/* ---------- mini reproductor ---------- */
#mini{position:fixed;left:calc(8px + var(--sal));right:calc(8px + var(--sar));bottom:calc(var(--barra) + 6px);
  background:rgba(31,23,51,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:15px;padding:9px 11px;display:none;
  align-items:center;gap:11px;z-index:40;cursor:pointer}
#mini.on{display:flex}
#mini .art{width:40px;height:40px;border-radius:9px;font-size:calc(16px * var(--esc))}
#mini .r-t{font-size:calc(13.5px * var(--esc))}
#mini .r-s{font-size:calc(12px * var(--esc))}
.pp{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:linear-gradient(135deg,#a970ff,#ff5fa6);color:#fff;
  display:grid;place-items:center;border:0;cursor:pointer;padding:9px}
#mini .sig{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;border:0;cursor:pointer;padding:10px;margin-left:-4px}
#mini .sig[hidden]{display:none}
#mini .prog{position:absolute;left:11px;right:11px;bottom:4px;height:2px;background:var(--pista);
  border-radius:2px;overflow:hidden}
#mini .prog i{display:block;height:100%;background:var(--purple);width:0}
.live{font-size:calc(9px * var(--esc));font-weight:700;color:#120e1e;background:var(--pink);border-radius:4px;
  padding:1px 5px;letter-spacing:.05em;flex:0 0 auto}
.live.malo{background:var(--gold)}

/* ---------- hoja de acciones (sube desde abajo) ---------- */
#hoja{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;
  background:rgba(4,3,8,.64);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#hoja.on{display:flex}
#hoja .caja{width:100%;max-height:84%;overflow-y:auto;scrollbar-width:none;
  background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:8px calc(var(--gutter) + var(--sar)) calc(var(--sab) + 16px) calc(var(--gutter) + var(--sal))}
#hoja .caja::-webkit-scrollbar{display:none}
#hoja .asa{width:38px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 14px}
#hoja h4{margin:0 0 4px;font-family:var(--font-d);font-size:calc(17px * var(--esc));font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hoja .sub{color:var(--muted);font-size:calc(12.5px * var(--esc));margin-bottom:13px;line-height:1.45}
.opc{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:9px 12px;
  background:var(--card2);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;
  font-size:calc(14.5px * var(--esc));color:var(--ink);cursor:pointer;text-align:left;font-weight:500}
.opc .em{font-size:calc(18px * var(--esc));flex:0 0 auto;width:24px;text-align:center}
.opc .tx{min-width:0;flex:1}
.opc .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.opc small{display:block;color:var(--dim);font-size:calc(11.5px * var(--esc));font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opc:active{background:rgba(169,112,255,.18)}
.opc[disabled]{opacity:.45}

/* ---------- barra inferior ---------- */
#barra{position:fixed;left:0;right:0;bottom:0;height:var(--barra);padding-left:var(--sal);padding-right:var(--sar);
  padding-bottom:var(--sabn);background:rgba(18,14,30,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(138,118,198,.32);display:none;z-index:45}
#barra.on{display:flex}
/* Por si el fondo de la barra no llegase al borde de la pantalla, esto lo
   alarga hacia abajo. Va en absolute para NO convertirse en un hijo mas del
   flex y descolocar los botones. (el hueco negro del 29/09/2026) */
#barra::after{content:'';position:absolute;top:100%;left:0;right:0;height:180px;
  background:rgba(18,14,30,.96);pointer-events:none}
#barra button{flex:1;background:none;border:0;color:var(--dim);
  font-size:calc(11px * min(var(--esc), 1.2));display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-weight:600}
#barra button .i{line-height:0;display:block}
#barra button .i svg{width:27px;height:27px;display:block;fill:none;
  stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#barra button.on .i svg{stroke-width:2.4}
#barra button.on{color:var(--purple)}

/* ---------- sonando ahora ---------- */
#now{position:fixed;inset:0;background:var(--bg2);z-index:70;display:none;flex-direction:column;
  padding:calc(var(--sat) + 14px) calc(26px + var(--sar)) calc(var(--sab) + 22px) calc(26px + var(--sal));
  overflow-y:auto;scrollbar-width:none}
#now::-webkit-scrollbar{display:none}
#now.on{display:flex}
.now-top{display:flex;justify-content:space-between;align-items:center;font-size:calc(11px * var(--esc));
  color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px;flex:0 0 auto}
.now-top span{cursor:pointer;font-size:calc(20px * var(--esc));color:var(--muted)}
#n-art{width:100%;height:auto;aspect-ratio:1;border-radius:20px;margin-bottom:22px;font-size:calc(72px * var(--esc));
  box-shadow:0 20px 50px rgba(0,0,0,.55);flex:0 0 auto;max-height:46vh}
#now h3{font-family:var(--font-d);font-weight:700;font-size:calc(21px * var(--esc));margin:0 0 4px;
  letter-spacing:-.02em;text-align:center}
#n-s{color:var(--muted);font-size:calc(14px * var(--esc));text-align:center;min-height:21px}
#n-cal{display:none!important;color:var(--cyan);font-size:calc(10.5px * var(--esc));text-align:center;letter-spacing:.11em;
  text-transform:uppercase;font-weight:700;margin:6px 0 16px;min-height:13px}
.seek{flex:0 0 auto;position:relative;height:30px;margin:2px 0 0;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.seek::before{content:"";position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:rgba(169,112,255,.2)}
.seek i{position:absolute;left:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,#a970ff,#ff5fa6);width:0;
  box-shadow:0 0 12px rgba(255,95,166,.45)}
.seek i::after{content:"";position:absolute;right:-8px;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 3px rgba(169,112,255,.35),0 2px 8px rgba(0,0,0,.5);transition:transform .15s}
.seek[data-arr] i::after{transform:scale(1.45)}
.seek.vivo i::after{display:none}
#now-cerrar{display:grid;place-items:center;width:52px;height:52px;margin:-8px 0 -8px -10px;color:var(--text,#f6f2ff)}
.times{flex:0 0 auto;display:flex;justify-content:space-between;font-size:calc(12.5px * var(--esc));font-variant-numeric:tabular-nums;color:var(--muted);margin:2px 2px 22px}
.ctrls{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:4px;margin:0 2px 22px}
.ctrls button{background:none;border:0;color:var(--text,#f6f2ff);cursor:pointer;padding:0;flex:0 0 auto;
  width:56px;height:56px;border-radius:50%;display:grid;place-items:center;transition:transform .12s,background .15s}
.ctrls button:active{transform:scale(.88);background:rgba(169,112,255,.18)}
.ctrls .sm{width:48px;height:48px;color:var(--dim)}
.ctrls .sm.on{color:#ff5fa6;background:rgba(255,95,166,.14)}
.ctrls .big{width:76px;height:76px;padding:0;border-radius:50%;color:#fff;
  background:linear-gradient(135deg,#a970ff,#ff5fa6);box-shadow:0 8px 26px rgba(169,112,255,.5),0 0 0 6px rgba(169,112,255,.12);
  display:grid;place-items:center}
.ctrls .big svg{width:36px;height:36px}
.ctrls .big.suena{animation:latido 2.4s ease-in-out infinite}
@keyframes latido{0%,100%{box-shadow:0 8px 26px rgba(169,112,255,.5),0 0 0 6px rgba(169,112,255,.12)}50%{box-shadow:0 8px 30px rgba(255,95,166,.6),0 0 0 12px rgba(255,95,166,.08)}}
.cola{margin-top:auto;padding-top:14px}
.cola h4{font-family:var(--font-d);font-size:calc(11px * var(--esc));letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);margin:0 0 8px}

/* ---------- avisos flotantes ---------- */
#toast{position:fixed;left:calc(16px + var(--sal));right:calc(16px + var(--sar));bottom:calc(var(--barra) + 74px);z-index:90;
  display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(31,23,51,.97);border:1px solid var(--line);border-left:3px solid var(--purple);
  border-radius:12px;padding:11px 14px;font-size:calc(13px * var(--esc));color:var(--ink);
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:sube .25s}
.toast.malo{border-left-color:var(--red)}
.toast.bueno{border-left-color:var(--cyan)}
@keyframes sube{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- modo seguro ---------- */
#seguro{position:fixed;inset:0;background:var(--bg);z-index:120;display:none;flex-direction:column;
  justify-content:center;align-items:center;padding:calc(var(--sat) + 30px) 28px calc(var(--sab) + 30px);text-align:center}
#seguro.on{display:flex}
#seguro{padding-left:calc(28px + var(--sal));padding-right:calc(28px + var(--sar))}
#seguro .em{font-size:calc(48px * var(--esc));margin-bottom:8px}
#seguro h2{font-family:var(--font-d);font-size:calc(23px * var(--esc));margin:0 0 8px;letter-spacing:-.02em}
#seguro p{color:var(--muted);font-size:calc(14px * var(--esc));max-width:32ch;margin:0 0 24px;line-height:1.6}
#seguro .btn{max-width:320px}
#seguro pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;
  font-size:calc(10px * var(--esc));color:var(--dim);max-width:100%;max-height:110px;overflow:auto;text-align:left;
  white-space:pre-wrap;word-break:break-word;margin-top:18px}

/* ---------- modo coche: todo el doble de grande ---------- */
body.coche #now{padding-left:calc(16px + var(--sal));padding-right:calc(16px + var(--sar))}
body.coche #n-art{max-height:24vh;margin-bottom:14px}
body.coche #now h3{font-size:calc(30px * var(--esc));line-height:1.15}
body.coche #n-s{font-size:calc(18px * var(--esc))}
body.coche #n-cal{display:none}
body.coche .times{font-size:calc(15px * var(--esc));margin-bottom:22px}
body.coche .seek{height:44px}
/* Conduciendo solo hacen falta tres cosas: atras, play, adelante.
   Aleatorio y repetir se ajustan antes de arrancar, no al volante. */
body.coche .ctrls{gap:26px;margin-bottom:24px}
body.coche .ctrls .sm{display:none}
body.coche .ctrls button{width:84px;height:84px}
body.coche .ctrls button svg{width:44px;height:44px}
body.coche .ctrls .big{width:118px;height:118px;padding:0;flex:0 0 auto}
body.coche .ctrls .big svg{width:58px;height:58px}
body.coche .cola{display:none}
body.coche .now-top span{font-size:calc(26px * var(--esc))}
#coche-salir{display:none;width:100%;background:var(--card2);border:1px solid var(--line);
  border-radius:16px;padding:16px;color:var(--muted);font-size:calc(17px * var(--esc));cursor:pointer;margin-top:auto}
body.coche #coche-salir{display:block}

/* ---------- carga ---------- */
#carga{position:fixed;inset:0;background:var(--bg);z-index:110;display:flex;
  flex-direction:column;justify-content:center;align-items:center;gap:14px}
#carga .carga-logo{width:min(84vw,360px);height:auto;animation:late 1.8s ease-in-out infinite}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#carga div{color:var(--dim);font-size:calc(13px * var(--esc))}
.oculto{display:none !important}
</style>

      if(!db.objectStoreNames.contains('emisoras'))
        db.createObjectStore('emisoras', {keyPath:'id'});          // añadidas a mano (de la casa)
      if(!db.objectStoreNames.contains('favradio'))
        db.createObjectStore('favradio', {keyPath:'k'});           // duenyo|nombre
      if(!db.objectStoreNames.contains('videos')){
        var v = db.createObjectStore('videos', {keyPath:'id'});
        v.createIndex('duenyo','duenyo',{unique:false});
      }
    };
    p.onsuccess = function(){ DB = p.result;
      DB.onversionchange = function(){ try{DB.close();}catch(_){} };
      res(DB); };
    p.onerror = function(){ rej(p.error); };
    p.onblocked = function(){ rej(new Error('base de datos bloqueada por otra pestaña')); };
  });
}
function tx(stores, modo){ return DB.transaction(stores, modo||'readonly'); }
function pedir(req){
  return new Promise(function(res, rej){
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error); };
  });
}
function todos(store, indice, valor){
  var s = tx([store]).objectStore(store);
  return pedir(indice ? s.index(indice).getAll(valor) : s.getAll());
}
function guardarCrudo(store, obj){
  var t = tx([store],'readwrite');
  return pedir(t.objectStore(store).put(obj));
}
/* iOS a veces responde «Error preparing Blob/File data» al volver a escribir la carátula leída de la
   base (se perdían veces/favorito/género). Se reintenta con una copia nueva del blob y, si ni así,
   sin carátula (se vuelve a pedir sola) antes que perder el resto del registro. */
async function guardar(store, obj){
  try{ return await guardarCrudo(store, obj); }
  catch(e){
    if(store !== 'canciones' || !obj || !obj.caratula || !/blob|file/i.test(String(e && e.message))) throw e;
    try{
      var b = obj.caratula, copia = new Blob([await b.arrayBuffer()], {type: b.type});
      return await guardarCrudo(store, Object.assign({}, obj, {caratula: copia}));
    }catch(_){
      anotar('guardar', 'carátula ilegible: guardo la canción sin ella', obj.titulo);
      return await guardarCrudo(store, Object.assign({}, obj, {caratula: null}));
    }
  }
}
function borrar(store, k){
  var t = tx([store],'readwrite');
  return pedir(t.objectStore(store).delete(k));
}
function leer(store, k){
  return pedir(tx([store]).objectStore(store).get(k));
}
/* Solo las claves. Para 'audios' es la diferencia entre traerse una lista de
   textos y traerse TODOS los MP3 del telefono a la vez. (fallo del 29/09/2026) */
function claves(store){
  return pedir(tx([store]).objectStore(store).getAllKeys());
}
/* ¿Existe ya esa clave? Sin traerse el contenido. */
async function existe(store, k){
  var s = tx([store]).objectStore(store);
  if(s.getKey) return !!(await pedir(s.getKey(k)));
  return (await pedir(s.count(k))) > 0;
}

/* ═════════════════ LECTOR DE ETIQUETAS ID3 ══════════════════════ */
/* Sin librerías. ID3v2.2/2.3/2.4 — TIT2 TPE1 TALB TCON TDRC TYER APIC. */
function leerTexto(bytes, cod){
  try{
    if(cod === 0) return new TextDecoder('iso-8859-1').decode(bytes).replace(/\0+$/,'');
    if(cod === 1){
      if(bytes.length >= 2 && ((bytes[0]===0xFF&&bytes[1]===0xFE)||(bytes[0]===0xFE&&bytes[1]===0xFF))){
        var be = bytes[0]===0xFE;
        return new TextDecoder(be?'utf-16be':'utf-16le').decode(bytes.subarray(2)).replace(/\0+$/,'');
      }
      return new TextDecoder('utf-16le').decode(bytes).replace(/\0+$/,'');
    }
    if(cod === 2) return new TextDecoder('utf-16be').decode(bytes).replace(/\0+$/,'');
    return new TextDecoder('utf-8').decode(bytes).replace(/\0+$/,'');
  }catch(_){
    return '';
  }
}
function sinSync(b){ return (b[0]<<21)|(b[1]<<14)|(b[2]<<7)|b[3]; }

function etiquetas(buf, nombreFichero){
  var out = {titulo:'', artista:'', album:'', genero:'', anio:'', caratula:null};
  try{
    var v = new Uint8Array(buf);
    if(v.length > 10 && v[0]===0x49 && v[1]===0x44 && v[2]===0x33){   // "ID3"
      var mayor = v[3];
      var total = sinSync([v[6],v[7],v[8],v[9]]);
      var p = 10;
      // saltar cabecera extendida
      if(v[5] & 0x40){
        var ext = mayor===4 ? sinSync([v[10],v[11],v[12],v[13]])
                            : ((v[10]<<24)|(v[11]<<16)|(v[12]<<8)|v[13]);
        p += ext;
      }
      var fin = Math.min(10 + total, v.length);
      var tamId = mayor === 2 ? 3 : 4;

      while(p + tamId + (mayor===2?3:6) <= fin){
        var id = '';
        for(var i=0;i<tamId;i++) id += String.fromCharCode(v[p+i]);
        if(!/^[A-Z0-9]+$/.test(id)) break;
        var tam, cab;
        if(mayor === 2){
          tam = (v[p+3]<<16)|(v[p+4]<<8)|v[p+5]; cab = 6;
        }else if(mayor === 4){
          tam = sinSync([v[p+4],v[p+5],v[p+6],v[p+7]]); cab = 10;
        }else{
          tam = ((v[p+4]<<24)|(v[p+5]<<16)|(v[p+6]<<8)|v[p+7])>>>0; cab = 10;
        }
        if(tam <= 0 || p + cab + tam > fin) break;
        var cuerpo = v.subarray(p+cab, p+cab+tam);

        if(id === 'APIC' || id === 'PIC'){
          try{
            var q = 1;                       // saltar byte de codificación
            if(id === 'PIC'){ q += 3; }      // PIC: tipo de imagen fijo, 3 bytes
            else { while(q < cuerpo.length && cuerpo[q] !== 0) q++; q++; }  // MIME
            q++;                             // tipo de portada
            // descripción, terminada en 0 (o 00 00 si es UTF-16)
            var cod0 = cuerpo[0];
            if(cod0 === 1 || cod0 === 2){
              while(q+1 < cuerpo.length && !(cuerpo[q]===0 && cuerpo[q+1]===0)) q += 2;
              q += 2;
            }else{
              while(q < cuerpo.length && cuerpo[q] !== 0) q++;
              q++;
            }
            if(q < cuerpo.length - 8){
              var img = cuerpo.subarray(q);
              var mime = (img[0]===0x89) ? 'image/png' : 'image/jpeg';
              out.caratula = new Blob([img], {type:mime});
            }
          }catch(err){ anotar('caratula', err.message); }
        }else if(id.charAt(0) === 'T'){
          var txt = leerTexto(cuerpo.subarray(1), cuerpo[0]).trim();
          if(id === 'TIT2' || id === 'TT2') out.titulo = txt;
          else if(id === 'TPE1' || id === 'TP1') out.artista = txt;
          else if(id === 'TALB' || id === 'TAL') out.album = txt;
          else if(id === 'TCON' || id === 'TCO') out.genero = txt.replace(/^\((\d+)\)\s*/,'');
          else if(id === 'TDRC' || id === 'TYER' || id === 'TYE'){
            var m = txt.match(/\d{4}/); if(m && !out.anio) out.anio = m[0];
          }
        }
        p += cab + tam;
      }
    }
  }catch(err){ anotar('id3', err.message); }

  // Respaldo: el nombre del fichero "Artista - Título"
  var base = String(nombreFichero||'').replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  if(!out.titulo || !out.artista){
    var pr = base.split(' - ');
    if(pr.length >= 2){
      if(!out.artista) out.artista = pr[0].trim();
      if(!out.titulo)  out.titulo  = pr.slice(1).join(' - ').trim();
    }
  }
  if(!out.titulo)  out.titulo  = base || 'Sin título';
  if(!out.artista) out.artista = 'Artista desconocido';
  if(!out.album)   out.album   = 'Sin álbum';
  if(!out.genero)  out.genero  = 'Sin género';
  return out;
}

/* ═════════ CALIDAD REAL DEL AUDIO ══════════════════════════════
   Lee la primera cabecera de trama MPEG para saber el bitrate y la
   frecuencia de verdad del fichero. La app NUNCA recodifica: guarda
   el archivo tal cual entró, byte por byte.                         */
var BITRATES_V1L3 = [0,32,40,48,56,64,80,96,112,128,160,192,224,256,320,0];
var BITRATES_V2L3 = [0,8,16,24,32,40,48,56,64,80,96,112,128,144,160,0];
var FRECS = {3:[44100,48000,32000], 2:[22050,24000,16000], 0:[11025,12000,8000]};

function calidad(buf, tipo){
  try{
    var v = new Uint8Array(buf), i = 0, fin = Math.min(v.length, 200000);
    // saltar la etiqueta ID3 si la hay
    if(v.length>10 && v[0]===0x49 && v[1]===0x44 && v[2]===0x33)
      i = 10 + ((v[6]<<21)|(v[7]<<14)|(v[8]<<7)|v[9]);
    for(; i < fin-4; i++){
      if(v[i] !== 0xFF || (v[i+1] & 0xE0) !== 0xE0) continue;
      var ver = (v[i+1] >> 3) & 3, capa = (v[i+1] >> 1) & 3;
      if(capa !== 1 || ver === 1) continue;              // solo Layer III
      var bi = (v[i+2] >> 4) & 15, fi = (v[i+2] >> 2) & 3;
      if(bi === 0 || bi === 15 || fi === 3) continue;
      var kbps = (ver === 3 ? BITRATES_V1L3 : BITRATES_V2L3)[bi];
      var hz = (FRECS[ver] || FRECS[3])[fi];
      var canales = ((v[i+3] >> 6) & 3) === 3 ? 'mono' : 'estéreo';
      if(kbps && hz) return {kbps:kbps, hz:hz, canales:canales, formato:'MP3'};
    }
  }catch(err){ anotar('calidad', err.message); }
  // No es MP3: deducimos el formato por el tipo del fichero
  var t = String(tipo||'').toLowerCase();
  var f = t.indexOf('flac')>=0 ? 'FLAC' : t.indexOf('wav')>=0 ? 'WAV'
        : (t.indexOf('mp4')>=0||t.indexOf('m4a')>=0||t.indexOf('aac')>=0) ? 'AAC/M4A'
        : t.indexOf('ogg')>=0 ? 'OGG' : '';
  return {kbps:0, hz:0, canales:'', formato:f};
}
function textoCalidad(c, bytes, dur){
  if(!c || !c.formato) return '';
  if(c.kbps) return c.formato + ' ' + c.kbps + ' kbps';
  // Sin cabecera legible: estimamos el bitrate por tamaño y duración
  if(bytes && dur > 1) return (c.formato||'Audio') + ' ~' + Math.round(bytes*8/dur/1000) + ' kbps';
  return c.formato;
}

async function huella(buf){
  try{
    // Con los primeros 2 MB + el tamaño basta para saber si es el mismo fichero,
    // y es mucho más rápido que digerir 8 MB.
    var trozo = buf.byteLength > 2097152 ? buf.slice(0, 2097152) : buf;
    var h = await crypto.subtle.digest('SHA-256', trozo);
    var a = Array.prototype.map.call(new Uint8Array(h), function(b){
      return ('0'+b.toString(16)).slice(-2); }).join('');
    return a.slice(0,32) + '-' + buf.byteLength;
  }catch(err){
    anotar('huella', err.message);
    return 'x' + buf.byteLength + '-' + Math.random().toString(36).slice(2,10);
  }
}

/* ═══════════════════════════════════════════════════════════════════
   BUSCADORES DE FUERA (YouTube y Internet Archive)
   Ninguno pide clave. Los dos se consultan con varios servidores en
   fila: si el primero está caído, se pasa solo al siguiente y recuerda
   cuál funcionó para empezar por ése la próxima vez.
   ═══════════════════════════════════════════════════════════════════ */

// Piped: fachada libre de YouTube. Buscar escribiendo, sin clave de Google.
var PIPED = ['https://api.piped.private.coffee', 'https://pipedapi.ducks.party',
             'https://pipedapi.kavin.rocks', 'https://pipedapi.adminforge.de',
             'https://pipedapi.darkness.services'];

/* Cada llamada a internet pasa por aquí. Tres defensas (v1.37.1):
   · interruptor por servidor: tras 3 fallos seguidos se le da un descanso (1 min, luego 2, 4… hasta 10)
     y se falla al instante en vez de gastar batería y datos; en cuanto responde bien se olvida.
   · una sola petición idéntica a la vez (Inicio, Novedades y portadas pedían lo mismo varias veces).
   · un reintento tras 700 ms solo si fue un fallo de red suelto («Load failed»), no un 4xx/5xx. */
var SERV = {}, EN_VUELO = {};
function hostDe(url){ var m = /^https?:\/\/([^\/?#]+)/i.exec(url); return m ? m[1] : url; }
function traerConLimite(url, ms){
  var h = hostDe(url), st = SERV[h] || (SERV[h] = {fallos:0, hasta:0, tanda:0});
  if(navigator.onLine === false) return Promise.reject(new Error('sin conexión'));
  if(Date.now() < st.hasta) return Promise.reject(new Error('servidor en descanso (' + h + ')'));
  if(EN_VUELO[url]) return EN_VUELO[url];
  function intento(){
    var ctrl = new AbortController();
    var reloj = setTimeout(function(){ ctrl.abort(); }, ms || 9000);
    return fetch(url, {signal: ctrl.signal, mode: 'cors', credentials: 'omit'})
      .then(function(r){
        clearTimeout(reloj);
        if(!r.ok){ var e = new Error('HTTP ' + r.status); e.http = r.status; throw e; }
        return r.json();
      })
      .catch(function(e){ clearTimeout(reloj); throw e; });
  }
  var pr = intento().catch(function(e){
    if(e.http || (e && e.name === 'AbortError')) throw e;                 // el servidor contestó o se colgó: no se repite
    return new Promise(function(ok){ setTimeout(ok, 700); }).then(intento);
  }).then(function(d){
    st.fallos = 0; st.tanda = 0; return d;
  }, function(e){
    if(++st.fallos >= 3){ st.tanda = Math.min((st.tanda || 0) + 1, 4); st.hasta = Date.now() + 60000 * Math.pow(2, st.tanda - 1); st.fallos = 0; anotar('red', 'descanso para ' + h, e.message); }
    throw e;
  });
  EN_VUELO[url] = pr;
  var fin = function(){ delete EN_VUELO[url]; };
  pr.then(fin, fin);
  return pr;
}

function servidoresPorOrden(lista, clave){
  var bueno = null;
  try{ bueno = localStorage.getItem(clave); }catch(_){}
  if(!bueno || lista.indexOf(bueno) < 0) return lista.slice();
  return [bueno].concat(lista.filter(function(x){ return x !== bueno; }));
}

async function buscarYouTube(texto){

  }
  throw ultimo || new Error('ningún servidor respondió');
}

/* Escribes "Líder", "Barquisimeto", "Venezuela" o "Líder Venezuela" y se

          if(!e) return;
          var k2 = e.url.toLowerCase();
          if(vistas[k2]) return;
          vistas[k2] = true;
          var pajar = sinTildes(x.name + ' ' + (x.state || '') + ' ' + (x.tags || '') + ' ' + (x.country || ''));
          var pts = 0;
          palabras.forEach(function(w){ if(pajar.indexOf(w) >= 0) pts++; });
          if(cc && String(x.countrycode).toUpperCase() === cc) pts++;
          // entre empatadas, primero las de casa: Venezuela y Colombia, y luego el resto de habla hispana
          var pc = String(x.countrycode).toUpperCase();
          if(pc === 'VE' || pc === 'CO') pts += 0.4;
          else if(/^(ES|DO|MX|PR|AR|PE|EC|CL|PA|CU|CR|HN|GT|SV|NI|BO|UY|PY|AD)$/.test(pc)) pts += 0.2;
          lista.push({e:e, pts:pts, i:lista.length});
        });
      });
      lista.sort(function(a, b){ return (b.pts - a.pts) || (a.i - b.i); });
      return lista.map(function(o){ return o.e; }).slice(0, 50);
    }catch(err){ ultimo = err; anotar('radiobrowser', orden[s2] + ' \u00b7 ' + err.message); }
  }
  throw ultimo || new Error('ningún servidor respondió');
}
var rbResultados = [], rbBuscando = false, rbTexto = '', rbFallo = '';
var rbTurno = 0;
async function lanzarBusquedaMundo(texto){
  texto = String(texto || '').trim();
  var turno = ++rbTurno;
  if(!texto){ rbResultados = []; rbTexto = ''; rbFallo = ''; rbBuscando = false; pintarBuscar(); return; }
  rbBuscando = true; rbTexto = texto; rbFallo = ''; pintarBuscar();
  var res = [], fallo = '';
  try{
    res = await buscarEmisorasMundo(texto);

  }catch(err){
    res = []; fallo = 'No se pudo preguntar ahora mismo. Mira si tienes internet.';
  }
  if(turno !== rbTurno) return;          // ya escribió otra cosa: esta respuesta llega tarde
  rbResultados = res; rbFallo = fallo; rbBuscando = false; pintarBuscar();
}

/* Internet Archive — solo colecciones legalmente limpias:
   georgeblood = discos de 78 rpm digitalizados (dominio público)
   etree       = conciertos de bandas que autorizan la grabación
   netlabels   = sellos con licencia Creative Commons                   */
var IA_LIMPIO = '(collection:georgeblood OR collection:etree OR collection:netlabels)';

async function buscarArchive(texto){
  var q = 'mediatype:audio AND ' + IA_LIMPIO + (texto ? ' AND (' + texto + ')' : '');
  var url = 'https://archive.org/advancedsearch.php?q=' + encodeURIComponent(q) +
            '&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&fl%5B%5D=year' +
            '&fl%5B%5D=collection&rows=25&page=1&output=json';
  var d = await traerConLimite(url, 14000);
  var docs = (d && d.response && d.response.docs) || [];
  return docs.map(function(x){
    var t = x.title, c = x.creator, col = x.collection;
    return {id: x.identifier,
            titulo: (Array.isArray(t) ? t[0] : t) || x.identifier,
            autor: (Array.isArray(c) ? c[0] : c) || 'Desconocido',
            anio: x.year || '',
            coleccion: Array.isArray(col) ? col[0] : (col || '')};
  });
}

async function ficherosArchive(id){
  var d = await traerConLimite('https://archive.org/metadata/' + encodeURIComponent(id), 14000);
  var fs = (d && d.files) || [];
  return fs.filter(function(f){
      return /\.(mp3|ogg|m4a)$/i.test(f.name || '') && (+f.size || 0) > 60000;
    }).sort(function(a,b){ return (+b.size||0) - (+a.size||0); })
    .map(function(f){
      return {nombre: f.name, bytes: +f.size || 0,
              titulo: (f.title || f.name.replace(/\.[^.]+$/, '')),
              url: 'https://archive.org/download/' + encodeURIComponent(id) + '/' +
                   f.name.split('/').map(encodeURIComponent).join('/')};
    });
}

var vigilante = null, intentosVigilante = 0;
/* ⚠️ Este guardián ERA el problema (fallo del 28/09/2026). Daba la alarma a
   los 2,4 s sin avance y reasignaba la fuente. Pero en directo y con datos
   móviles un bache de 2 s es lo normal: cortaba la emisora cada 20 s.
   Y con la pantalla apagada era mortal, porque iOS no deja arrancar una
   fuente nueva de fondo y ya no volvía el sonido.
   Ahora: margen amplio, solo actúa si el elemento se quedó SIN datos, y
   con la pantalla apagada no toca la fuente jamás. */
function vigilar(){
  clearTimeout(vigilante);
  if(!actual || paradoPorMi || viendoVideo) return;
  var margen = actual.tipo === 'radio' ? 12000 : 4000;
  var t0 = audio.currentTime, leidoEn = Date.now();
  vigilante = setTimeout(function(){
    if(!actual || audio.paused || paradoPorMi) return;
    var pasado = Date.now() - leidoEn;
    // Con la pantalla apagada iOS congela los temporizadores. Si el aviso
    // llega tardísimo, la medida no vale: se vuelve a medir y punto.
    if(pasado > margen * 2.5){ vigilar(); return; }
    var avanzo   = audio.currentTime > t0 + 0.05;
    var conDatos = audio.readyState >= 3;   // HAVE_FUTURE_DATA = está sano
    if(avanzo || conDatos || pasado < margen){
      intentosVigilante = 0;
      vigilar();
      return;
    }
    intentosVigilante++;
    anotar('vigilante', 'sin avance, intento ' + intentosVigilante);
    if(document.hidden){
      // De fondo solo se permite lo más suave: darle al play otra vez.
      if(intentosVigilante > 8){
        recuperarAlVolver = true;
        anotar('vigilante', 'me rindo de fondo; lo retomo al volver');
        return;
      }
      var p0 = audio.play();
      if(p0 && p0.catch) p0.catch(function(){});
      setTimeout(vigilar, 1500);
    }else if(intentosVigilante === 1){
      var p1 = audio.play();
      if(p1 && p1.catch) p1.catch(function(){});
      setTimeout(vigilar, 1500);
    }else if(intentosVigilante <= 3){
      // Reasignar la fuente sobre el MISMO elemento (así no perdemos el
      // desbloqueo de iOS). Solo con la app a la vista.
      var src = audio.src;
      try{ audio.load(); }catch(_){}
      audio.src = src;
      var p = audio.play();
      if(p && p.catch) p.catch(function(){});
      setTimeout(vigilar, 1500);
    }else if(intentosVigilante === 4){
      recrearAudio();                       // último recurso: elemento nuevo
    }else{
      toast('El sonido no arranca. Toca ▶ otra vez.', 'malo', 5000);
      intentosVigilante = 0;
    }
  }, margen);
}

var reintento = null, espera = 1000, fallosRadio = 0;
/* ¿Otra app (WhatsApp, una llamada…) tiene el sonido? Entonces la radio NO se reconecta:
   reenganchar el stream le quitaba el audio a la otra app y no la dejaba sonar. */
function otraAppTieneElSonido(){
  var ses = '';
  try{ ses = navigator.audioSession && navigator.audioSession.state; }catch(_){}
  return ses === 'interrupted' || (pausaAjena && Date.now() - pausaAjena < 20000 && audio.paused);

function programarReconexion(){
  if(!actual || actual.tipo !== 'radio') return;
  if(paradoPorMi || viendoVideo) return;   // la paraste tú, o manda el vídeo
  if(otraAppTieneElSonido()){
    interrumpida = interrumpida || Date.now();
    clearTimeout(reintento);
    pintarEstado('En pausa · otra app está sonando');
    return;
  }
  clearTimeout(reintento);
  if(fallosRadio >= 10){
    pintarEstado('Esta emisora no responde. Prueba otra.');
    toast('📻 ' + esc(actual.titulo) + ' no responde ahora mismo.', 'malo', 5000);
    fallosRadio = 0; espera = 1000;
    return;
  }
  if(!navigator.onLine){
    pintarEstado('Sin conexión · esperando red…');
    return;   // el evento 'online' dispara la reconexión al instante
  }
  var jitter = Math.floor(Math.random() * 400);
  pintarEstado('Reconectando… (' + Math.round(espera/1000) + ' s)');
  reintento = setTimeout(function(){
    if(!actual || actual.tipo !== 'radio') return;
    if(otraAppTieneElSonido()){ interrumpida = interrumpida || Date.now(); pintarEstado('En pausa · otra app está sonando'); return; }
    fallosRadio++;
    anotar('radio', 'reintento ' + fallosRadio + ' de ' + actual.titulo);
    var u = actual.url;
    // El parámetro anti-caché, solo desde el segundo intento: hay emisoras
    // con la URL firmada a las que un parámetro de más les sienta mal.
    audio.src = fallosRadio >= 2
      ? u + (u.indexOf('?')>=0 ? '&' : '?') + '_r=' + Date.now()
      : u;
    var p = audio.play();
    if(p && p.catch) p.catch(function(){ espera = Math.min(espera*2, 30000); programarReconexion(); });
  }, espera + jitter);
  espera = Math.min(espera * 2, 30000);
}

  });

    else if(actual && actual.tipo === 'cancion' && !actual.remota){ repararCancion(); }
    else if(actual){ pintarEstado('No se pudo reproducir este archivo.'); }
  });

  audio.addEventListener('stalled', function(){

/* Autoreparación de una canción que no suena: 1º se vuelve a leer su archivo
   de la base de datos (la dirección temporal pudo caducar); 2º si sigue mal
   se salta a la siguiente, para que en el coche no se quede en silencio.   */
/* ═════════ Mezcla entre canciones (EXPERIMENTAL, apagada por defecto) ═════
   iOS no deja bajar el volumen de un <audio>, así que se pasa por Web Audio.
   Riesgo conocido: si el iPhone suspende ese audio con la pantalla apagada, se
   oiría silencio. Por eso: solo si se activa en Ajustes, se aplica al reiniciar,
   y si 2 s después de «sonar» el audio no está corriendo, se apaga sola y la
   app se reinicia SIN mezcla (autoreparación).                                  */
var MZ = {ctx:null, gain:null, b:null, gainB:null, listo:false, entra:false, puente:null, prep:null};
var SILENCIO = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function iniciarMezcla(){
  if(!AJ.mezcla || MZ.listo) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    MZ.ctx = new AC();
    MZ.gain = MZ.ctx.createGain(); MZ.gain.connect(MZ.ctx.destination);
    MZ.ctx.createMediaElementSource(audio).connect(MZ.gain);
    // Segundo reproductor, solo para la canción que entra mientras la otra se va.
    MZ.b = new Audio(); MZ.b.setAttribute('playsinline',''); MZ.b.preload = 'auto';
    MZ.gainB = MZ.ctx.createGain(); MZ.gainB.gain.value = 0.0001; MZ.gainB.connect(MZ.ctx.destination);
    MZ.ctx.createMediaElementSource(MZ.b).connect(MZ.gainB);
    MZ.listo = true;
    // NO se reanuda sola: si otra app tomó el sonido (WhatsApp, una llamada), se le deja.
    // Detector de silencio: tras una llamada o un audio de WhatsApp el iPhone deja el audio de la
    // mezcla «en marcha» pero MUDO (visto en el iPhone de Elibel, 1/10/2026). Se vigila la señal real.
    MZ.an = MZ.ctx.createAnalyser(); MZ.an.fftSize = 512; MZ.gain.connect(MZ.an);
    MZ.ctx.onstatechange = function(){
      var st = MZ.ctx.state;
      if(MZ.reiniciando) return;                       // el suspend/resume de abajo es mío: no es una interrupción
      anotar('sonido', 'mezcla: el audio pasó a ' + st);
      linea('mezcla:' + st);
      if(st === 'interrupted' || st === 'suspended') MZ.rota = true;
      if(st === 'running' && MZ.rota){
        MZ.rota = false;
        // 1º el truco habitual (parar y arrancar el motor); 2º se mide si suena de verdad
        // OJO: sin la bandera esto se llamaba a sí mismo en bucle (visto en el informe del 2/10: 30 vueltas en 70 ms)
        MZ.reiniciando = true;
        var libre = function(){ setTimeout(function(){ MZ.reiniciando = false; }, 400); };
        try{ MZ.ctx.suspend().then(function(){ return MZ.ctx.resume(); }).then(libre, libre); }catch(_){ libre(); }
        setTimeout(comprobarSonidoMezcla, 2500);
      }
    };
    // iOS solo deja arrancar un reproductor nuevo si antes lo tocaste con el dedo.
    // Con el primer toque se "desbloquea" el segundo, en silencio.
    document.addEventListener('click', function des(){
      document.removeEventListener('click', des);
      try{ MZ.b.src = SILENCIO; var q = MZ.b.play(); if(q && q.then) q.then(function(){ MZ.b.pause(); }).catch(function(){}); }catch(_){}
    });
    audio.addEventListener('playing', function(){
      try{ MZ.ctx.resume(); }catch(_){}
      setTimeout(function(){
        if(!MZ.listo || audio.paused || !actual) return;
        if(MZ.ctx.state !== 'running'){
          AJ.mezcla = false; guardarAjustes(); anotar('mezcla', 'audio no corría, mezcla apagada');
          toast('La mezcla no funcionó en este teléfono. La apago y reinicio.', 'malo', 2500);
          setTimeout(function(){ location.reload(); }, 1800);
        }
      }, 2000);
    });

        artwork: arte

          album:c.album, genero:c.genero, anio:c.anio, caratula:c.caratula||null,

async function anadirFicheros(lista){
  if(!lista || !lista.length) return;
  var ok = 0, repes = 0, malos = 0;
  toast('Añadiendo ' + lista.length + (lista.length===1?' canción…':' canciones…'));

  // Las huellas que YA tiene esta persona, leídas una sola vez (no una por fichero).
  var mias = {};
  try{
    (await todos('canciones', 'duenyo', yo)).forEach(function(c){ mias[c.hash] = true; });
  }catch(err){ anotarSeguro('anadir/leer', err); }

  for(var i=0;i<lista.length;i++){
    var f = lista[i];
    try{
      // Guardián 5: comprobar el hueco antes de guardar
      var sitio = await hayHueco(f.size);
      if(!sitio){
        toast('No queda espacio en el teléfono. Se pararon en la nº ' + (i+1) + '.', 'malo', 6000);
        break;
      }
      var buf = await f.arrayBuffer();
      var h = await huella(buf);
      var meta = etiquetas(buf, f.name);
      var cal = calidad(buf, f.type || f.name);

      // ¿ya existe el AUDIO en el teléfono? (lo comparten los dos perfiles)
      // El Blob se guarda TAL CUAL: no se recodifica ni se toca un byte.
      if(!(await existe('audios', h)))
        await guardar('audios', {hash:h, blob:new Blob([buf], {type:f.type||'audio/mpeg'}), bytes:f.size});

      // ¿ya la tiene ESTA persona?
      if(mias[h]){ repes++; continue; }
      mias[h] = true;

      await guardar('canciones', limpia({
        id: yo + '_' + h, duenyo: yo, hash: h, titulo: meta.titulo, artista: meta.artista,
        album: meta.album, genero: meta.genero, anio: meta.anio, caratula: meta.caratula,
        fav:false, veces:0, anadida:Date.now(), dur:0, bytes:f.size, cal:cal
      }));
      ok++;
    }catch(err){
      malos++; anotarSeguro('anadir', err, f && f.name);
    }
  }
  await cargarDatos();
  pintarVista();
  var msg = ok + (ok===1?' canción añadida':' canciones añadidas');
  if(repes) msg += ' · ' + repes + ' ya la' + (repes===1?' tenías':'s tenías');
  if(malos) msg += ' · ' + malos + ' no se pudo leer';
  toast(msg, ok?'bueno':'malo', 4500);
}
function anotarSeguro(o, err, extra){ anotar(o, (err && err.message) || err, extra); }

/* ═════════ Guardián 5 · espacio y persistencia ══════════════════ */
async function hayHueco(bytes){
  try{
    if(!navigator.storage || !navigator.storage.estimate) return true;
    var e = await navigator.storage.estimate();
    if(!e.quota) return true;
    var libre = e.quota - e.usage;
    if(libre < bytes * 1.6) return false;
    if(e.usage / e.quota > 0.8) toast('⚠️ Estás usando más del 80% del espacio.', 'malo', 5000);
    return true;
  }catch(_){ return true; }
}
async function pedirPersistencia(){
  try{
    if(navigator.storage && navigator.storage.persist){
      var ya = await navigator.storage.persisted();
      if(!ya) await navigator.storage.persist();
    }
  }catch(err){ anotar('persist', err.message); }
}

// dentroDe = id de la lista que estás mirando; entonces el botón de la

/* Las carátulas en memoria, convertidas a direcci\u00f3n solo cuando hacen
   falta. Antes la car\u00e1tula solo se ve\u00eda en "Ahora suena" y las listas eran
   todas cuadros de color, que es justo de lo que se quej\u00f3. */
var CARATS = {};
function urlCaratula(c){
  if(!c || !c.caratula) return '';
  if(!CARATS[c.id]){
    try{ CARATS[c.id] = URL.createObjectURL(c.caratula); }catch(_){ return ''; }
  }
  return CARATS[c.id];
}
function soltarCaratulas(){

  CARATS = {};
}
/* ═════════ Portadas de verdad ═══════════════════════════════════
   Cuando el MP3 no trae car\u00e1tula dentro, se busca la del disco en la base
   de Apple: p\u00fablica, sin clave y sin cuenta. Se guarda lo encontrado (y
   tambi\u00e9n lo NO encontrado) para no volver a preguntar por lo mismo.
   Sale a internet solo el artista y el t\u00edtulo de la canci\u00f3n.            */
var PORTADAS = {};
try{ PORTADAS = JSON.parse(localStorage.getItem('mm_portadas2') || '{}') || {}; }catch(_){ PORTADAS = {}; }
var colaPortadas = [], buscandoPortada = false;

function clavePortada(c){
  return ((c.artista||'') + '|' + (c.titulo||'')).toLowerCase().replace(/\s+/g,' ').trim();
}
function limpiaBusqueda(t){
  return String(t||'')
    .replace(/\((?:feat|ft|con|remix|version|versi\u00f3n|en vivo|live)[^)]*\)/gi,'')
    .replace(/\[[^\]]*\]/g,'')
    .replace(/\s+/g,' ').trim();
}
async function traerPortada(c){
  var busca = limpiaBusqueda(c.artista) + ' ' + limpiaBusqueda(c.titulo);
  var u = 'https://itunes.apple.com/search?term=' + encodeURIComponent(busca) +
          '&media=music&entity=song&limit=1';
  try{
    var d = await traerConLimite(u, 9000);
    var x = (d && d.results || [])[0];
    if(!x || !x.artworkUrl100) return '';
    return String(x.artworkUrl100).replace('100x100bb', '600x600bb');
  }catch(err){
    // Apple no contesta (le pasa a su móvil): se pregunta a Deezer.
    var dz = await jsonp('https://api.deezer.com/search?q=' + encodeURIComponent(busca) + '&limit=1', 9000);
    var y = ((dz && dz.data) || [])[0];
    return (y && y.album && (y.album.cover_big || y.album.cover_medium)) || '';
  }
}
/* De una en una y con respiro: son decenas de canciones y no hace falta
   atropellar a nadie. Cuando encuentra una, repinta lo que se est\u00e9 viendo. */
async function masticarPortadas(){
  if(buscandoPortada) return;
  buscandoPortada = true;
  while(colaPortadas.length){
    var c = colaPortadas.shift();
    var k = clavePortada(c);
    if(PORTADAS[k] !== undefined) continue;
    var url = '', fallo = false;
    try{ url = await traerPortada(c); }
    catch(err){ fallo = true; anotar('portada', err.message, c.titulo); }
    if(fallo){ await new Promise(function(r){ setTimeout(r, 600); }); continue; }   // un fallo de red NO es «no hay portada»
    PORTADAS[k] = url;
    try{ localStorage.setItem('mm_portadas2', JSON.stringify(PORTADAS)); }catch(_){}
    if(url){
      pintarVistaSuave();
      if(actual && actual.tipo === 'cancion' && clavePortada(actual) === k){ try{ pintarAhora(buscarCancion(actual.id)); }catch(_){} }
    }
    await new Promise(function(r){ setTimeout(r, 220); });
  }
  buscandoPortada = false;
}
function portadaDe(c){
  if(!c || !c.artista || !c.titulo) return '';
  if(c.artista === 'Artista desconocido') return '';
  var k = clavePortada(c);
  if(PORTADAS[k] !== undefined) return PORTADAS[k];
  for(var i=0;i<colaPortadas.length;i++) if(clavePortada(colaPortadas[i]) === k) return '';
  colaPortadas.push(c);
  setTimeout(masticarPortadas, 60);
  return '';
}

  [/clasic|cl\u00e1sic|opera|\u00f3pera|sinf|piano/i,           '\uD83C\uDFBB'],

  for(var i=0;i<ESTILOS.length;i++) if(ESTILOS[i][0].test(t)) return ESTILOS[i][1];

/* El cuadro de una canci\u00f3n: su car\u00e1tula si la trae; si no, su color con el
   dibujo del estilo. Nunca un cuadro liso y mudo. */
function imgRota(img){
  var s = img.parentNode; if(!s) return;
  s.classList.add('vacia'); s.textContent = img.getAttribute('data-ico') || '🎵';
}
function cuadroCancion(c, grande){
  var f = 'background:' + tono(c.titulo + c.artista);
  var u = urlCaratula(c) || portadaDe(c);
  if(u) return '<span class="art" style="'+f+'"><img src="'+esc(u)+'" alt="" data-ico="'+iconoEstilo(c)+'" onerror="imgRota(this)"></span>';
  var dentro = c.falta ? '\u26A0\uFE0F' : iconoEstilo(c);

function filaCancion(c, dentroDe){

/* ═════════ Música de hoy: éxitos y cantantes (Apple) + historial ═════

   moviles, o lo que sea): Deezer, tambien sin clave. No deja leer con fetch, asi
   que se pregunta con JSONP (una etiqueta <script>). */
function jsonp(url, ms){
  return new Promise(function(ok, mal){
    var cb = 'mmjp' + Date.now() + Math.floor(Math.random() * 1e4), sc = document.createElement('script'), t;
    function limpiar(){ clearTimeout(t); try{ delete window[cb]; }catch(_){ window[cb] = undefined; } sc.remove(); }
    window[cb] = function(d){ limpiar(); ok(d); };
    sc.onerror = function(){ limpiar(); mal(new Error('Deezer no responde')); };
    t = setTimeout(function(){ limpiar(); mal(new Error('Deezer tarda demasiado')); }, ms || 9000);
    sc.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'output=jsonp&callback=' + cb;
    document.head.appendChild(sc);
  });
}
function pistaDeDeezer(x){
  if(!x || !x.title) return null;
  var img = (x.album && (x.album.cover_big || x.album.cover_medium)) || '';
  return pistaApple('dz' + x.id, x.title_short || x.title, (x.artist && x.artist.name) || '', img, x.preview || '', x.link || '', '', '');
}

/* Los cantantes que tocan en "Porque escuchas a…": el que más suena en su
   historial, favoritos y biblioteca, y otro que rota cada día. */
function nombresParaTi(){
  var cuenta = {};
  function suma(n, peso){
    n = String(n || '').split(/,| & | feat\.?| ft\.?| x /i)[0].trim();
    if(n && n.length < 40 && peso) cuenta[n] = (cuenta[n] || 0) + peso;
  }
  histo().forEach(function(h){ if(h.k !== 'r' && h.k !== 'y') suma(h.artista, 2); });
  CANCIONES.forEach(function(c){ suma(c.artista, c.fav ? 3 : (c.veces ? 1 : 0)); });
  favAudius().forEach(function(p){ suma(p.artista, 3); });
  var top = '', mejor = 0;
  for(var n in cuenta) if(cuenta[n] > mejor){ mejor = cuenta[n]; top = n; }
  var dia = Math.floor(Date.now() / 864e5), r = [];
  if(top) r.push({n:top, por:true});
  for(var k=0; r.length < 2 && k < ARTISTAS_SUG.length; k++){
    var a = ARTISTAS_SUG[(dia + k) % ARTISTAS_SUG.length];
    if(a.toLowerCase() !== top.toLowerCase()) r.push({n:a, por:false});
  }
  return r;
}
function delCantante(lista, n){
  var m = n.toLowerCase();
  var suyas = lista.filter(function(p){ return p.artista.toLowerCase().indexOf(m) >= 0; });
  return (suyas.length >= 3 ? suyas : lista).slice(0, 10);
}

  INI.cargandoArt = true;

      .then(function(x){ INI.art[o.n] = delCantante(x, o.n); repintarInicio(); })
      .catch(function(e){ INI.art[o.n] = []; anotar('apple', e.message); });
  }));
  INI.cargandoArt = false;

async function cargarInicio(forzar){
  if(INI.cargando) return;
  var cc = paisIni();
  if(INI.yo !== yo){ INI.yo = yo; INI.art = {}; INI.t = 0; }
  if(INI.cc !== cc){
    INI.cc = cc; INI.t = 0; INI.apple = []; INI.au = []; INI.rb = [];
    try{
      var c = JSON.parse(localStorage.getItem('mm_ini_' + cc) || 'null');
      if(c && c.apple){ INI.apple = c.apple; INI.au = c.au || []; INI.rb = c.rb || []; INI.t = c.t || 0; }
    }catch(_){}
    // Lo de la última vez sale al instante, aunque haya que refrescarlo luego.
    if(INI.apple.length) repintarInicio();
  }
  // Sin ahorro: se refresca cada 4 horas. Con ahorro: nunca solo (lo pides tú con ↻).
  if(!forzar && INI.t && (AJ.ahorro || (Date.now() - INI.t) < 4 * 3600 * 1000)){
    if(!AJ.ahorro) cargarArtistas(cc);
    return;
  }
  INI.cargando = true; INI.fallo = false;
  repintarInicio();
  var bien = 0;
  function ok(f){ return function(x){ f(x); bien++; repintarInicio(); }; }
  var tareas = [
    exitosApple(cc).then(ok(function(x){ INI.apple = x; })),
    buscarAudius('').then(ok(function(x){ INI.au = x.slice(0, 10).map(function(p){ p.tipo = 'audius'; return p; }); })),
    radiosTop(RB_PAIS[cc]).then(ok(function(x){ INI.rb = x; }))
  ];
  tareas.push(cargarArtistas(cc).then(function(){ bien++; }));
  await Promise.all(tareas.map(function(p){ return p.catch(function(e){ anotar('inicio', e.message); }); }));
  INI.cargando = false;
  if(bien){
    INI.t = Date.now();
    try{ localStorage.setItem('mm_ini_' + cc, JSON.stringify({t:INI.t, apple:INI.apple, au:INI.au, rb:INI.rb})); }catch(_){}
  }else INI.fallo = true;
  repintarInicio();
}

var NOV = {items:[], t:0, cargando:false, yo:''};
function cantantesSeguidos(){
  var m = {};
  CANCIONES.forEach(function(c){
    var a = String(c.artista || '').split(/,| & | feat\.?| ft\.?| x /i)[0].trim();
    if(a && a !== 'Artista desconocido') m[a] = (m[a] || 0) + 1; });
  var base = Object.keys(m).sort(function(a, b){ return m[b] - m[a]; }).slice(0, 8);
  var extra = [];
  try{ extra = JSON.parse(localStorage.getItem('mm_sigue_' + yo) || '[]') || []; }catch(_){}

async function cargarNovedades(forzar){
  if(NOV.cargando || !navigator.onLine || AJ.sinNovedades) return;
  if(NOV.yo !== yo){
    NOV = {items:[], t:0, cargando:false, yo:yo};
    try{ var c = JSON.parse(localStorage.getItem('mm_nov_' + yo) || 'null'); if(c){ NOV.items = c.items || []; NOV.t = c.t || 0; } }catch(_){}
    if(NOV.items.length) repintarInicio();
  }
  if(!forzar && NOV.t && (AJ.ahorro || Date.now() - NOV.t < 24 * 3600 * 1000)) return;
  var quien = cantantesSeguidos();
  if(!quien.length) return;
  NOV.cargando = true;
  var res = [], desde = Date.now() - 400 * 24 * 3600 * 1000, fallos = 0;
  for(var i=0;i<quien.length && fallos < 3;i++){
    try{
      var d = await traerConLimite('https://itunes.apple.com/search?term=' + encodeURIComponent(quien[i]) + '&entity=musicArtist&limit=1', 9000);
      var ar = (d.results || [])[0];
      if(!ar || !ar.artistId) continue;
      var l = await traerConLimite('https://itunes.apple.com/lookup?id=' + ar.artistId + '&entity=album&sort=recent&limit=6', 9000);
      (l.results || []).forEach(function(x){
        if(x.wrapperType !== 'collection' || !x.releaseDate) return;
        var f = Date.parse(x.releaseDate);
        if(f < desde || f > Date.now() + 3 * 24 * 3600 * 1000) return;
        var nombre = String(x.collectionName || '').replace(/\s*-\s*(Single|EP)$/i, '');
        var img = x.artworkUrl100 ? String(x.artworkUrl100).replace('100x100bb', '240x240bb') : '';
        var p = pistaApple('nv' + x.collectionId, nombre, x.artistName || quien[i], img, '', '', '', '');
        if(p){ p.fecha = f; res.push(p); }
      });
      fallos = 0;
    }catch(err){ fallos++; anotar('novedades', err.message, quien[i]); }
  }
  NOV.cargando = false;
  if(res.length || !fallos){
    var vistos = {};
    NOV.items = res.sort(function(a, b){ return b.fecha - a.fecha; })
      .filter(function(p){ var k = normTxt(p.titulo + p.artista); if(vistos[k]) return false; vistos[k] = 1; return true; }).slice(0, 14);
    NOV.t = Date.now();
    try{ localStorage.setItem('mm_nov_' + yo, JSON.stringify({t:NOV.t, items:NOV.items})); }catch(_){}
  }
  repintarInicio();
}

/* Repinta SOLO lo que cambió. Cada bloque de Inicio que sigue igual se deja tal cual (no se vuelve
   a crear), así las imágenes no parpadean cuando llegan datos nuevos (novedades, portadas, éxitos…). */
function reconciliar(C, html){
  var t = document.createElement('template'); t.innerHTML = html;
  var nuevos = Array.prototype.slice.call(t.content.childNodes);
  var mapa = {};
  Array.prototype.slice.call(C.childNodes).forEach(function(n){
    if(n.nodeType === 1){ var k = n.outerHTML; (mapa[k] = mapa[k] || []).push(n); }
  });
  var orden = nuevos.map(function(n){
    if(n.nodeType !== 1) return n;
    var l = mapa[n.outerHTML];
    return (l && l.length) ? l.shift() : n;
  });
  // primero se quitan los bloques viejos que ya no valen; los que se reutilizan no se mueven
  Array.prototype.slice.call(C.childNodes).forEach(function(n){ if(orden.indexOf(n) < 0) C.removeChild(n); });
  orden.forEach(function(n, i){
    if(C.childNodes[i] !== n) C.insertBefore(n, C.childNodes[i] || null);
  });
}

/* Canción entera, nunca un fragmento. Primero se busca en Audius (suena entera
   y sigue con la pantalla apagada); si no está, se abre el vídeo en YouTube. */
function normTxt(t){
  return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\(.*?\)|\[.*?\]/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
async function reproducirCompleta(p){
  cerrarHoja();
  toast('Buscando la canción entera…', null, 1800);
  try{
    var r = await buscarAudius(p.artista + ' ' + p.titulo);
    var nt = normTxt(p.titulo), na = normTxt(p.artista).split(' ')[0], m = null;
    for(var i=0;i<r.length && !m;i++)
      if(normTxt(r[i].titulo).indexOf(nt) >= 0 && normTxt(r[i].artista).indexOf(na) >= 0) m = r[i];
    if(m){ m.tipo = 'audius'; viendoVideo = false; tocarAudius(m, r); pintarVista(); return; }
  }catch(err){ anotar('completa', err.message); }
  escucharCompleta(p);
}

/* Reproductor con la API de YouTube: si el dueño no deja verlo aquí (errores

   «El vídeo no está disponible». */
var ytApiListo = null, ytPlayer = null, ytProbados = {};
function cargarYTApi(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(ytApiListo) return ytApiListo;
  ytApiListo = new Promise(function(ok, mal){
    var prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function(){ try{ if(prev) prev(); }catch(_){} ok(); };
    var sc = document.createElement('script');
    sc.src = 'https://www.youtube.com/iframe_api';
    sc.onerror = function(){ ytApiListo = null; mal(new Error('sin API de YouTube')); };
    document.head.appendChild(sc);
    setTimeout(function(){ mal(new Error('la API de YouTube tarda')); }, 8000);
  });
  return ytApiListo;
}
async function montarReproductorYT(){
  var id = ytVerId, host = $('yt-host');
  if(!host || !id) return;
  ytProbados[id] = true;
  try{
    await cargarYTApi();
    if(id !== ytVerId || !$('yt-host')) return;
    ytPlayer = new YT.Player('yt-host', {
      videoId: id, host: 'https://www.youtube-nocookie.com',
      playerVars: {playsinline: 1, rel: 0},
      events: {onError: function(e){ ytFallo(id, e && e.data); }}
    });
  }catch(err){
    anotar('youtube', err.message);
    host = $('yt-host');
    if(host) host.outerHTML = '<iframe id="yt-host" src="https://www.youtube-nocookie.com/embed/'+esc(id)+'?playsinline=1&rel=0" '+
      'allow="accelerometer;encrypted-media;gyroscope;picture-in-picture;fullscreen" allowfullscreen></iframe>';
  }
}
function ytFallo(id, codigo){
  anotar('youtube', 'vídeo no disponible (' + codigo + ')', id);

  [/bachata/i, 'Bachata'],
  [/salsa|tropical|merengue|cumbia|vallenat|timba|son cubano|caribe/i, 'Salsa y tropical'],

  [/electr|dance|house|techno|edm|club/i, 'Electrónica y dance'],
  [/rock|metal|punk|grunge|alternativ|indie/i, 'Rock'],
  [/jazz|blues|swing/i, 'Jazz y blues'],

  [/bolero|balada|romant/i, 'Baladas'],

function normGenero(g){
  g = String(g || '').replace(/\(\d+\)/g, '').replace(/\s+/g, ' ').trim();

  for(var i=0;i<GENEROS_REGLAS.length;i++) if(GENEROS_REGLAS[i][0].test(g)) return GENEROS_REGLAS[i][1];
  return g.charAt(0).toUpperCase() + g.slice(1);

function generoDe(c){ return normGenero(c && c.genero) || 'Sin clasificar'; }

  try{
    var d = await traerConLimite('https://itunes.apple.com/search?term=' + encodeURIComponent(busca) + '&media=music&entity=song&limit=1', 9000);
    var x = (d && d.results || [])[0];
    return (x && x.primaryGenreName) || '';
  }catch(err){
    var dz = await jsonp('https://api.deezer.com/search?q=' + encodeURIComponent(busca) + '&limit=1', 9000);
    var y = ((dz && dz.data) || [])[0];
    if(!y || !y.album) return '';
    var al = await jsonp('https://api.deezer.com/album/' + y.album.id, 9000);

  }

  if(!pend.length) return;

      var g = await buscarGenero(c);
      fallos = 0;

      else{ GEN_NO[clavePortada(c)] = 1; try{ localStorage.setItem('mm_gen_no', JSON.stringify(GEN_NO)); }catch(_){} }

function guardarCola(){
  if(!yo) return;
  try{
    localStorage.setItem('mm_cola_'+yo, JSON.stringify({ids:cola.slice(0,500), pos:colaPos,
      alea:aleatorio, rep:repetir}));
  }catch(_){}
}
function recuperarCola(){
  try{
    var c = JSON.parse(localStorage.getItem('mm_cola_'+yo) || 'null');
    if(c && c.ids && c.ids.length){
      cola = c.ids; colaPos = c.pos;

      pintarModos();
    }
  }catch(_){}
}

/* Autoreparación de la cola: quita canciones borradas o sin archivo. */
function sanearCola(){
  var idAct = cola[colaPos], antes = cola.length;
  cola = cola.filter(function(id){ var c = buscarCancion(id); return c && !c.falta; });
  var i = cola.indexOf(idAct);
  colaPos = i >= 0 ? i : Math.min(Math.max(colaPos, 0), Math.max(cola.length - 1, 0));
  if(cola.length !== antes){ anotar('reparado', 'cola limpiada', (antes - cola.length) + ' canciones'); guardarCola(); }
}
/* Autoreparación al arrancar: datos guardados rotos, listas con canciones borradas. */
async function autoReparar(){
  try{
    var rotos = 0;
    for(var i = localStorage.length - 1; i >= 0; i--){
      var k = localStorage.key(i);
      if(!k || k.indexOf('mm_') !== 0) continue;
      var v = localStorage.getItem(k);
      if(v && (v.charAt(0) === '{' || v.charAt(0) === '[')){
        try{ JSON.parse(v); }catch(_){ localStorage.removeItem(k); rotos++; anotar('reparado', 'dato guardado roto, borrado', k); }
      }
    }
    sanearCola();
    for(var j = 0; j < LISTAS.length; j++){
      var l = LISTAS[j], ya = l.canciones || [];
      var nuevas = ya.filter(function(id){ return !!buscarCancion(id); });
      if(nuevas.length !== ya.length){ l.canciones = nuevas; await guardar('listas', l); anotar('reparado', 'lista limpiada', l.nombre); }
    }
  }catch(err){ anotar('autoReparar', err.message); }
}
